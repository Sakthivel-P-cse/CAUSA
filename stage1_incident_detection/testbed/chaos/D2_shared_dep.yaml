# ============================================================
# D2 — Two services sharing a DOWNSTREAM dep, both faulted. Tests: false-merge
# handling (isolation Stage 3, origin clustering). The shared dep (product-
# catalog) makes the two cascades touch — isolation must still return TWO
# ranked lists, not merge them into one.
# ------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: d2-fault-a-recommendation
  namespace: otel-demo
  labels:
    causa/scenario: D2
    causa/dual-group: D2
    causa/true-root: recommendation
    causa/fault-class: Resource
spec:
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: recommendation
  stressors:
    cpu:
      workers: 2
      load: 95
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  # checkout (not ad): checkout AND recommendation both call product-catalog, so
  # the two cascades genuinely touch at the shared dep. ad is a leaf and shares
  # nothing — it can't create the false-merge this scenario is meant to test.
  name: d2-fault-b-checkout
  namespace: otel-demo
  labels:
    causa/scenario: D2
    causa/dual-group: D2
    causa/true-root: checkout
    causa/fault-class: Resource
spec:
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: checkout
  stressors:
    memory:
      workers: 1
      size: "85%"
