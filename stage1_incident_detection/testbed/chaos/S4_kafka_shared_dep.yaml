# ============================================================
# S4 — Shared-dependency confound. Stresses: origin has NO EDGE to victims
# (finding the common infra ancestor). True root: kafka. Fault class:
# Dependency/Resource. Expected hard cell.
#
# Kafka is the shared async backbone: checkout→accounting & fraud both degrade
# with no service edge between them. Only the unified infra+service Influence
# Graph can attribute both to kafka. This is the scenario Online Boutique CANNOT
# reproduce (no Kafka) — the reason the OTel Demo is the primary testbed.
# ------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: s4-kafka-shared-dep
  namespace: otel-demo
  labels:
    causa/scenario: S4
    causa/true-root: kafka
    causa/fault-class: Dependency
spec:
  action: delay
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: kafka
  direction: to
  delay:
    latency: "800ms"
    jitter: "200ms"
    correlation: "50"
