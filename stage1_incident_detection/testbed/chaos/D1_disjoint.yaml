# ============================================================
# D1 — Two faults at DISJOINT services (no shared deps). Tests: clean split
# (isolation Stage 1, connected components). Two true roots.
# The harness applies BOTH at once and records two Incident rows sharing a
# dual-injection group id.
# ------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: d1-fault-a-currency
  namespace: otel-demo
  labels:
    causa/scenario: D1
    causa/dual-group: D1
    causa/true-root: currency
    causa/fault-class: Dependency
spec:
  action: delay
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: currency
  direction: to
  delay:
    latency: "600ms"
    jitter: "100ms"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: d1-fault-b-email
  namespace: otel-demo
  labels:
    causa/scenario: D1
    causa/dual-group: D1
    causa/true-root: email
    causa/fault-class: Resource
spec:
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: email
  stressors:
    cpu:
      workers: 2
      load: 90
