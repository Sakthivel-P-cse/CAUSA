replicaCount: 1

image:
  repository: causa/dashboard
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  PROMETHEUS_URL:    "http://prometheus.prometheus.svc.cluster.local:9090"
  TEMPO_URL:         "http://tempo.tempo.svc.cluster.local:3200"
  LOKI_URL:          "http://loki.loki.svc.cluster.local:3100"
  ALERTMANAGER_URL:  "http://alertmanager.alertmanager.svc.cluster.local:9093"
  POSTGRES_HOST:     "postgres.postgres.svc.cluster.local"
  POSTGRES_PORT:     "5432"
  POSTGRES_DB:       "causa"
  POSTGRES_USER:     "causa"

existingSecret: ""   # set in prod to avoid plain-text passwords in values

ingress:
  enabled: false
  className: nginx
  host: causa.local
  tls: []
