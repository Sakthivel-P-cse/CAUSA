{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "causa-dashboard.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "causa-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.env.POSTGRES_PASSWORD | default "" | quote }}
{{- end }}
