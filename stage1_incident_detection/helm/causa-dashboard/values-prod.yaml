# values-prod.yaml — production overrides for causa-dashboard
replicaCount: 2

existingSecret: "dashboard-secret"   # must contain POSTGRES_PASSWORD

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: causa.your-domain.com
  tls:
    - secretName: causa-tls
      hosts:
        - causa.your-domain.com
