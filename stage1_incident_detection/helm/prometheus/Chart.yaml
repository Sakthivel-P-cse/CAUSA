# Chart.yaml file defines metadata about a Helm chart, such as its name, version, description, and dependencies. These files are essential for packaging, deploying, and managing applications and services (like Grafana, Loki, Prometheus, etc.) on Kubernetes clusters using Helm.
apiVersion: v2
name: prometheus
description: >
  Prometheus — metrics storage and alerting backend.
  Scrapes metrics from OpenTelemetry Collector and exposes
  them to Grafana for query and dashboarding.
type: application
version: 0.1.0
appVersion: "2.50.1"
keywords:
  - metrics
  - observability
  - prometheus
  - alerting
home: https://prometheus.io/
sources:
  - https://github.com/prometheus/prometheus
maintainers:
  - name: traceops-team
