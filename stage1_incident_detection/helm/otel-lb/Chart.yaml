# Chart.yaml file defines metadata about a Helm chart, such as its name, version, description, and dependencies. These files are essential for packaging, deploying, and managing applications and services (like Grafana, Loki, Prometheus, etc.) on Kubernetes clusters using Helm.
apiVersion: v2
name: otel-lb
description: >
  OpenTelemetry Collector in LOAD-BALANCER mode — a thin tier that
  sits between the agents and the gateway. It receives OTLP and
  re-exports it with the loadbalancingexporter, routing spans by
  trace ID so that every span of a given trace lands on the SAME
  gateway pod. This is what makes tail_sampling correct when the
  gateway runs more than one replica.
type: application
version: 0.1.0
appVersion: "0.96.0"
keywords:
  - opentelemetry
  - observability
  - loadbalancing
  - tail-sampling
  - tracing
home: https://opentelemetry.io/docs/collector/deployment/gateway/
sources:
  - https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/exporter/loadbalancingexporter
maintainers:
  - name: traceops-team
