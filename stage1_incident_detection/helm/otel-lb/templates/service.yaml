apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-lb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-lb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "otel-lb.selectorLabels" . | nindent 4 }}
  ports:
    # OTLP gRPC — agents forward traces here
    - name: otlp-grpc
      port: {{ .Values.service.ports.otlpGrpc }}
      targetPort: otlp-grpc
      protocol: TCP
    # OTLP HTTP
    - name: otlp-http
      port: {{ .Values.service.ports.otlpHttp }}
      targetPort: otlp-http
      protocol: TCP
    # Prometheus scrapes the LB's own metrics here
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    # Health check
    - name: health
      port: {{ .Values.service.ports.healthCheck }}
      targetPort: health
      protocol: TCP
