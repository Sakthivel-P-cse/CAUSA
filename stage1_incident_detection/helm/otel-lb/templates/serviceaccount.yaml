{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-lb.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-lb.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
# ClusterRole: the loadbalancingexporter k8s resolver watches the
# gateway Service's Endpoints (in another namespace) to build and
# maintain the trace-ID hash ring of gateway pod IPs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-lb.fullname" . }}
  labels:
    {{- include "otel-lb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-lb.fullname" . }}
  labels:
    {{- include "otel-lb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-lb.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-lb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
