# Chart.yaml file defines metadata about a Helm chart, such as its name, version, description, and dependencies. These files are essential for packaging, deploying, and managing applications and services (like Grafana, Loki, Prometheus, etc.) on Kubernetes clusters using Helm.
apiVersion: v2
name: loki
description: >
  Grafana Loki — log aggregation system.
  Receives structured logs from the OpenTelemetry Collector
  and exposes them to Grafana for query.
type: application
version: 0.1.0
appVersion: "2.9.4"
keywords:
  - logging
  - observability
  - opentelemetry
  - loki
home: https://grafana.com/oss/loki/
sources:
  - https://github.com/grafana/loki
maintainers:
  - name: traceops-team
