# Chart.yaml file defines metadata about a Helm chart, such as its name, version, description, and dependencies. These files are essential for packaging, deploying, and managing applications and services (like Grafana, Loki, Prometheus, etc.) on Kubernetes clusters using Helm.
apiVersion: v2
name: otel-collector
description: >
  OpenTelemetry Collector — central telemetry ingestion hub.
  Receives traces, metrics, and logs via OTLP (gRPC + HTTP) and
  routes them to Tempo, Prometheus, and Loki respectively.
type: application
version: 0.1.0
appVersion: "0.96.0"
keywords:
  - opentelemetry
  - observability
  - collector
  - tracing
  - metrics
  - logging
home: https://opentelemetry.io/docs/collector/
sources:
  - https://github.com/open-telemetry/opentelemetry-collector
maintainers:
  - name: causa-team
