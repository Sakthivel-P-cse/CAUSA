# ============================================================
# OTel Collector — Development environment overrides
# Debug exporter enabled, smaller resources
# ============================================================

replicaCount: 1

config:
  processors:
    batch:
      sendBatchSize: 512
      timeout: 2s
    memoryLimiter:
      limitMib: 200
      spikeLimitMib: 64

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
