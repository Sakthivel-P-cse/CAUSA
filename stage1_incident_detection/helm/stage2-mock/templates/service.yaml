apiVersion: v1
kind: Service
metadata:
  # MUST be `stage2-rca` so http://stage2-rca.stage2-rca.svc:8080/trigger (the
  # ingest trigger's STAGE2_WEBHOOK_URL) resolves here. Dev B's real chart
  # provides the same service name in this namespace — a clean swap.
  name: stage2-rca
  namespace: {{ .Release.Namespace }}
  labels:
    app: stage2-rca
spec:
  type: ClusterIP
  selector:
    app: stage2-rca
  ports:
    - name: http
      port: 8080
      targetPort: 8080
