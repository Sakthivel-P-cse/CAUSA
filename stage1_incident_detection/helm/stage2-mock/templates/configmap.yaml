apiVersion: v1
kind: ConfigMap
metadata:
  name: stage2-mock-script
  namespace: {{ .Release.Namespace }}
data:
  mock.py: |
    # DEV-ONLY mock Stage-2 receiver. Returns 200 to /trigger and /health and
    # logs the payload so the ingest trigger's forward path is observable. Not a
    # scorer — Dev B's real engine replaces this.
    import json
    import logging
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s mock-stage2: %(message)s")

    class Handler(BaseHTTPRequestHandler):
        def _reply(self, code=200):
            body = json.dumps({"status": "ok", "mock": True}).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            self._reply()

        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0) or 0)
            body = self.rfile.read(n) if n else b""
            logging.info("received %d bytes on %s: %s", n, self.path, body[:500])
            self._reply()

        def log_message(self, *args):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
