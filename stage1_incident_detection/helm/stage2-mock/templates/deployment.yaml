apiVersion: apps/v1
kind: Deployment
metadata:
  name: stage2-mock
  namespace: {{ .Release.Namespace }}
  labels:
    app: stage2-rca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stage2-rca
  template:
    metadata:
      labels:
        app: stage2-rca
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/mock.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: stage2-mock-script
        - name: tmp
          emptyDir: {}
