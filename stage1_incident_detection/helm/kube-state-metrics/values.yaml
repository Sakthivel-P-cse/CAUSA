# ============================================================
# kube-state-metrics — Default values (shared across all environments)
#
# Exposes Kubernetes object state as Prometheus metrics.
# Required by Stage 2 RCA — Infrastructure Level Graph (Graph 2).
#
# Key metrics produced:
#   kube_pod_info                             - pod → node mapping
#   kube_pod_container_status_restarts_total  - container restart counts
#   kube_node_status_condition                - node readiness / pressure
#   kube_pod_status_phase                     - pod phase (Running/Pending/Failed)
#   kube_deployment_status_replicas_available - deployment health
# ============================================================

replicaCount: 1

image:
  repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
  tag: "v2.11.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "kube-state-metrics"

service:
  type: ClusterIP
  ports:
    metrics: 8080    # Main metrics endpoint — scraped by Prometheus
    telemetry: 8081  # kube-state-metrics own self-metrics

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
