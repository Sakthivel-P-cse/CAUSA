apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tempo.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    server:
      http_listen_port: {{ .Values.config.server.http_listen_port }}

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: {{ .Values.config.distributor.receivers.otlp.protocols.grpc.endpoint }}
            http:
              endpoint: {{ .Values.config.distributor.receivers.otlp.protocols.http.endpoint }}

    ingester:
      max_block_duration: {{ .Values.config.ingester.max_block_duration }}

    compactor:
      compaction:
        block_retention: {{ .Values.config.compactor.compaction.block_retention }}

    storage:
      trace:
        backend: {{ .Values.config.backend }}
        {{- if eq .Values.config.backend "local" }}
        local:
          path: /var/tempo/traces
        {{- end }}
        {{- if eq .Values.config.backend "s3" }}
        s3:
          bucket: ${TEMPO_S3_BUCKET}
          endpoint: ${TEMPO_S3_ENDPOINT}
          region: ${TEMPO_S3_REGION}
          access_key: ${TEMPO_S3_ACCESS_KEY}
          secret_key: ${TEMPO_S3_SECRET_KEY}
          insecure: {{ .Values.config.storage.insecure }}
        {{- end }}
        wal:
          path: /var/tempo/wal

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: {{ .Values.config.metricsGenerator.remoteWriteUrl }}
            send_exemplars: true
      processor:
        service_graphs:
          histogram_buckets: {{ .Values.config.metricsGenerator.serviceGraphs.histogramBuckets }}
          max_items: {{ .Values.config.metricsGenerator.serviceGraphs.maxItems }}
          wait: {{ .Values.config.metricsGenerator.serviceGraphs.wait }}
          workers: {{ .Values.config.metricsGenerator.serviceGraphs.workers }}
        span_metrics:
          histogram_buckets: {{ .Values.config.metricsGenerator.spanMetrics.histogramBuckets }}
          enable_target_info: {{ .Values.config.metricsGenerator.spanMetrics.enableTargetInfo }}

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
          forwarder:
            queue_size: {{ .Values.config.metricsGenerator.forwarder.queueSize }}
            workers: {{ .Values.config.metricsGenerator.forwarder.workers }}
