# Chart.yaml file defines metadata about a Helm chart, such as its name, version, description, and dependencies. These files are essential for packaging, deploying, and managing applications and services (like Grafana, Loki, Prometheus, etc.) on Kubernetes clusters using Helm.
apiVersion: v2
name: tempo
description: >
  Grafana Tempo — distributed tracing backend.
  Receives OTLP traces from the OpenTelemetry Collector
  and exposes them to Grafana for query.
type: application
version: 0.1.0
appVersion: "2.4.1"
keywords:
  - tracing
  - observability
  - opentelemetry
  - tempo
home: https://grafana.com/oss/tempo/
sources:
  - https://github.com/grafana/tempo
maintainers:
  - name: causa-team
