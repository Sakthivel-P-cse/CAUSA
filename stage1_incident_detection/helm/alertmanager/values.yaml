# ============================================================
# Alertmanager — Default values
# Receives alerts from Prometheus, deduplicates them, and
# routes them to the Stage 2 RCA webhook.
# ============================================================

image:
  repository: prom/alertmanager
  tag: "v0.27.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "alertmanager"

replicaCount: 1

service:
  type: ClusterIP
  port: 9093

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: false
  storageClassName: ""
  size: 1Gi
  accessModes:
    - ReadWriteOnce

# ── Alertmanager routing configuration ───────────────────
# stage2WebhookUrl: the HTTP endpoint of the Stage 2 RCA trigger.
# In dev this points to the local Stage 2 service once deployed.
# Override this value when Stage 2 is deployed.
stage2WebhookUrl: "http://stage2-rca.stage2-rca.svc.cluster.local:8080/trigger"

config:
  # How long to wait before re-sending a firing alert
  repeatInterval: 1h
  # Wait this long to batch multiple alerts that fire together
  groupWait: 30s
  # After first notification, wait this long before sending updates
  groupInterval: 5m

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
