apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alertmanager.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alertmanager.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      # How long an alert is considered resolved after it stops firing
      resolve_timeout: 5m

    # ── Routing tree ─────────────────────────────────────────────
    # All alerts go to the Stage 2 RCA webhook by default.
    # The RCA engine uses the alert labels (service, namespace,
    # alertname, severity) to decide where to start its investigation.
    route:
      receiver: stage2-rca-webhook
      group_by: ['alertname', 'service', 'namespace']
      group_wait:      {{ .Values.config.groupWait }}
      group_interval:  {{ .Values.config.groupInterval }}
      repeat_interval: {{ .Values.config.repeatInterval }}

      # Critical alerts go immediately without grouping delay
      routes:
        - match:
            severity: critical
          receiver: stage2-rca-webhook
          group_wait: 0s
          continue: true

    # ── Receivers ────────────────────────────────────────────────
    receivers:
      - name: stage2-rca-webhook
        webhook_configs:
          - url: {{ .Values.stage2WebhookUrl | quote }}
            send_resolved: true
            http_config:
              follow_redirects: true

    # ── Inhibition rules ─────────────────────────────────────────
    # Suppress child-service alerts when a node-level alert is
    # already firing — avoids flooding Stage 2 with duplicate incidents.
    inhibit_rules:
      - source_match:
          alertname: NodeMemoryPressure
        target_match_re:
          alertname: ServiceHighErrorRate|ServiceHighLatency|ContainerMemoryNearLimit
        equal: ['node']
      - source_match:
          alertname: NodeCPUSaturation
        target_match_re:
          alertname: ServiceHighLatency|ServiceTrafficSpike
        equal: ['node']
