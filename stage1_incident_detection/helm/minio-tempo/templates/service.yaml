apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio-tempo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio-tempo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "minio-tempo.selectorLabels" . | nindent 4 }}
  ports:
    # S3 API — Tempo connects here to read/write trace blocks
    - name: api
      port: {{ .Values.service.ports.api }}
      targetPort: api
      protocol: TCP
    # MinIO web console
    - name: console
      port: {{ .Values.service.ports.console }}
      targetPort: console
      protocol: TCP
