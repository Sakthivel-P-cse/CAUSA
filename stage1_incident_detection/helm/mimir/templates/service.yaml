apiVersion: v1
kind: Service
metadata:
  name: {{ include "mimir.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mimir.selectorLabels" . | nindent 4 }}
  ports:
    # HTTP — Prometheus remote_write push (/api/v1/push), query API, /ready
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    # gRPC — internal component comms
    - name: grpc
      port: {{ .Values.service.ports.grpc }}
      targetPort: grpc
      protocol: TCP
