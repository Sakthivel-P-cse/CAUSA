# Chart.yaml file defines metadata about a Helm chart, such as its name, version, description, and dependencies. These files are essential for packaging, deploying, and managing applications and services (like Grafana, Loki, Prometheus, etc.) on Kubernetes clusters using Helm.
apiVersion: v2
name: mimir
description: >
  Grafana Mimir in monolithic (single-binary) mode — horizontally
  scalable long-term metric storage. Receives Prometheus remote_write
  on :8080 and stores metric blocks in MinIO (S3). This is the metrics
  scale-out tier: a single Prometheus cannot hold large-fleet
  cardinality, so it remote_writes here for retention and query.
type: application
version: 0.1.0
appVersion: "2.12.0"
keywords:
  - mimir
  - metrics
  - prometheus
  - remote-write
  - long-term-storage
home: https://grafana.com/docs/mimir/latest/
sources:
  - https://github.com/grafana/mimir
maintainers:
  - name: traceops-team
