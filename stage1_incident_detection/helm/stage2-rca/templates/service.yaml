apiVersion: v1
kind: Service
metadata:
  name: {{ include "stage2-rca.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stage2-rca.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.redis.enabled }}
    - port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
      name: redis
    {{- end }}
  selector:
    {{- include "stage2-rca.selectorLabels" . | nindent 4 }}
