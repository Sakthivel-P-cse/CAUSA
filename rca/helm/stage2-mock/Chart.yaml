apiVersion: v2
name: stage2-mock
description: >-
  DEV-ONLY mock Stage-2 receiver. Provides the `stage2-rca` Service (namespace
  stage2-rca, port 8080) so the Dev-A ingest trigger's forward path and the
  Alertmanager → causa-ingest → stage2 routing are testable end-to-end WITHOUT
  the real RCA engine. It is installed only through the explicit
  `--stage2 mock` development profile and shares the real chart's Helm release
  and service slot.
type: application
version: 0.1.0
appVersion: "0.1.0"
