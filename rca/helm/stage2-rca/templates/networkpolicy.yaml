{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stage2-rca.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stage2-rca.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stage2-rca.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
