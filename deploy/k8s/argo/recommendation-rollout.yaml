apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: recommendation
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: recommendation
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation
    spec:
      containers:
        - name: recommendation
          image: ghcr.io/open-telemetry/demo:2.1.3-recommendation
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OTEL_SERVICE_NAME
              value: recommendation
  strategy:
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      steps:
        - setWeight: 5
        - pause: {duration: 30}
        - analysis:
            templates:
              - templateName: causa-prometheus-success
            args:
              - name: service-name
                value: recommendation
        - setWeight: 15
        - pause: {duration: 30}
        - setWeight: 30
        - pause: {duration: 30}
        - analysis:
            templates:
              - templateName: causa-prometheus-success
            args:
              - name: service-name
                value: recommendation
        - setWeight: 50
        - pause: {duration: 30}
        - setWeight: 100
