# ============================================================
# S2 — Retry storm / backpressure. Stresses: edge orientation, D (anomaly
# flows BACKWARD from callee to caller). True root: the delayed callee
# (product-catalog). Fault class: Dependency.
# Tests the sync-edge reversal in the Influence Graph.
#
# Network delay on a sync dependency → callers retry → saturation propagates
# UPSTREAM against the call arrow. This is exactly what the sync-reversal fixes.
# ------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: s2-retry-storm-delay
  namespace: otel-demo
  labels:
    causa/scenario: S2
    causa/true-root: product-catalog
    causa/fault-class: Dependency
spec:
  action: delay
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: product-catalog
  direction: to
  delay:
    latency: "500ms"
    jitter: "100ms"
    correlation: "50"
