# ============================================================
# S0 — Downstream cascade (CONTROL). Stresses: sanity. Expected top-3: 100%.
# True root: product-catalog. Fault class: AppLogic (feature-flag fault).
#
# CANONICAL S0 is the demo's flagd `productCatalogFailure` feature flag (an
# app-logic fault that makes GetProduct fail). The harness special-cases S0 by
# patching flagd rather than applying a Chaos Mesh CRD:
#
#   kubectl -n otel-demo patch configmap flagd-config --type merge -p \
#     '{"data":{"demo.flagd.json":"...productCatalogFailure defaultVariant=on..."}}'
#
# The HTTPChaos below is a Chaos-Mesh-native STAND-IN so S0 can run uniformly
# through the harness on clusters where flagd patching is inconvenient. It aborts
# a fraction of inbound calls to product-catalog → errors cascade to frontend.
#
# CAVEAT: product-catalog is a gRPC (HTTP/2) service. HTTPChaos `target: Request`
# may NOT intercept gRPC on all Chaos-Mesh versions — if S0 shows no effect,
# prefer the canonical flagd `productCatalogFailure` flag above (the harness
# warns about this). This stand-in is best-effort, not the source of truth.
# ------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: s0-productcatalog-failure
  namespace: otel-demo
  labels:
    causa/scenario: S0
    causa/true-root: product-catalog
    causa/fault-class: AppLogic
spec:
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      # Reconcile with your demo's labels: `kubectl -n otel-demo get pods --show-labels`
      app.kubernetes.io/name: product-catalog
  target: Request
  port: 8080
  abort: true
  # duration/onset are controlled by the harness (apply → hold → delete).
