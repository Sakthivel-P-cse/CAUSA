# ============================================================
# D3 — Two faults with onsets WITHIN the coupling window Δ. Tests:
# expected-hard / abstention. When two independent faults co-start inside Δ,
# isolation cannot confidently separate them and should DEGRADE-TO-FLAG
# (MULTI-INCIDENT — ambiguous) rather than guess (spec §4.1 / §7).
#
# The harness applies both with near-identical onset (Δ ~ a few seconds). The
# expected result is abstention, not a clean two-way split — that is the
# correct, honest behavior being validated.
# ------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: d3-fault-a-payment
  namespace: otel-demo
  labels:
    causa/scenario: D3
    causa/dual-group: D3
    causa/true-root: payment
    causa/fault-class: Dependency
spec:
  action: delay
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: payment
  direction: to
  delay:
    latency: "700ms"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: d3-fault-b-shipping
  namespace: otel-demo
  labels:
    causa/scenario: D3
    causa/dual-group: D3
    causa/true-root: shipping
    causa/fault-class: Dependency
spec:
  action: delay
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      app.kubernetes.io/name: shipping
  direction: to
  delay:
    latency: "700ms"
