# ============================================================
# S0 — Downstream cascade (CONTROL). Stresses: sanity. Expected top-3: 100%.
# True root: product-catalog. Fault class: AppLogic (feature-flag fault).
#
# CANONICAL S0 is the demo's flagd `productCatalogFailure` feature flag (an
# app-logic fault that makes GetProduct fail). run_scenario flips that flag
# itself — it patches `flagd-config` `defaultVariant → on`, holds, then resets —
# and does NOT apply the CRD below. Because a flagd flip has no AllInjected
# object to poll, S0 records a ground-truth row ONLY with --verify-effect (or
# --allow-unverified), so an ineffective injection can't mint a phantom (M2):
#
#   python -m testbed.harness.run_scenario --scenario S0 --verify-effect --out gt/
#
# The HTTPChaos below is a Chaos-Mesh-native STAND-IN kept for clusters where
# flagd patching is unavailable; apply it BY HAND (`kubectl apply -f`) there. It
# aborts a fraction of inbound calls to product-catalog → errors cascade.
#
# CAVEAT: product-catalog is a gRPC (HTTP/2) service. HTTPChaos `target: Request`
# may NOT intercept gRPC on all Chaos-Mesh versions — if the stand-in shows no
# effect, use the canonical flagd flag (what the harness does). This stand-in is
# best-effort, not the source of truth.
# ------------------------------------------------------------
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: s0-productcatalog-failure
  namespace: otel-demo
  labels:
    causa/scenario: S0
    causa/true-root: product-catalog
    causa/fault-class: AppLogic
spec:
  mode: all
  selector:
    namespaces: [otel-demo]
    labelSelectors:
      # Reconcile with your demo's labels: `kubectl -n otel-demo get pods --show-labels`
      app.kubernetes.io/name: product-catalog
  target: Request
  port: 8080
  abort: true
  # duration/onset are controlled by the harness (apply → hold → delete).
