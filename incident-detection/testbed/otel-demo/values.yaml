# OpenTelemetry Demo — Helm values for the Causa testbed.
# Chart pin: open-telemetry/opentelemetry-demo 0.40.10
#
# Use envOverrides (not default.env) so chart defaults like OTEL_SERVICE_NAME stay.

default:
  envOverrides:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-agent.otel-agent.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_COLLECTOR_NAME
      value: "otel-agent.otel-agent.svc.cluster.local"

opentelemetry-collector:
  enabled: false
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

components:
  load-generator:
    enabled: true
    env:
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "false"
      - name: LOCUST_USERS
        value: "5"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  accounting:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 768Mi

  ad:
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi

  fraud-detection:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 768Mi

  flagd:
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    sidecarContainers: []

  image-provider:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi

  product-reviews:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi

  recommendation:
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
