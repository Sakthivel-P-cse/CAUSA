apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "otel-agent.selectorLabels" . | nindent 4 }}
  # Metrics are per-node; keep endpoints resolvable even if a pod
  # is momentarily unready so Prometheus scrape gaps stay small.
  internalTrafficPolicy: Local
  ports:
    # OTLP gRPC — primarily reached via host IP; exposed here too.
    - name: otlp-grpc
      port: {{ .Values.service.ports.otlpGrpc }}
      targetPort: otlp-grpc
      protocol: TCP
    # OTLP HTTP
    - name: otlp-http
      port: {{ .Values.service.ports.otlpHttp }}
      targetPort: otlp-http
      protocol: TCP
    # Prometheus scrapes the agent's own metrics here
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    # Health check
    - name: health
      port: {{ .Values.service.ports.healthCheck }}
      targetPort: health
      protocol: TCP
