{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-agent.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
# ClusterRole: the k8sattributes processor reads pod/namespace/node
# metadata cluster-wide to enrich telemetry with Kubernetes context.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-agent.fullname" . }}
  labels:
    {{- include "otel-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-agent.fullname" . }}
  labels:
    {{- include "otel-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
