# ============================================================
# OTel Agent — Production environment overrides
# Larger batches, more memory headroom, mTLS to gateway documented.
# ============================================================

# Traces go through the LB tier so tail sampling sees whole traces.
traceLoadBalancer:
  endpoint: "otel-lb.otel-lb.svc.cluster.local:4317"
  tls:
    insecure: true   # Deliberate: in-cluster traffic. Enable mTLS as for the gateway below.

gateway:
  endpoint: "otel-collector.otel-collector.svc.cluster.local:4317"
  # ── Agent → Gateway TLS ─────────────────────────────────
  # Option A — In-cluster plaintext (acceptable if a service mesh
  #             such as Istio/Linkerd provides mTLS):
  #   insecure: true
  #
  # Option B — App-layer mTLS via cert-manager (recommended for
  #             high-security environments):
  #   insecure: false
  #   cert_file: /etc/otel/certs/tls.crt
  #   key_file:  /etc/otel/certs/tls.key
  #   ca_file:   /etc/otel/certs/ca.crt
  #   (mount the cert-manager Certificate secret in daemonset.yaml)
  tls:
    insecure: true   # Deliberate: in-cluster traffic. See options above to enable mTLS.

config:
  processors:
    batch:
      sendBatchSize: 2048
      timeout: 10s
    memoryLimiter:
      limitMib: 600
      spikeLimitMib: 192

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
