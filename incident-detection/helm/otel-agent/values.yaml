# ============================================================
# OpenTelemetry Collector — AGENT mode (DaemonSet) — defaults
#
# One pod per node. Two jobs:
#   1. Receive OTLP from pods on the same node (traces/metrics/logs)
#   2. Collect node-local signals that MUST be gathered per-node:
#        - filelog:     container stdout/stderr log files
#        - hostmetrics: node CPU/mem/disk/network/filesystem
# Everything is enriched with k8sattributes and forwarded OTLP
# to the gateway (otel-collector). No storage exporters here.
# ============================================================

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.96.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "otel-agent"

# Where the agent forwards each signal:
#   traces  → otel-lb  (trace-ID load balancer → correct gateway pod
#             for tail sampling). MUST go through the LB so whole
#             traces land on one gateway replica.
#   metrics → gateway directly (round-robin is fine; no trace affinity)
#   logs    → gateway directly (round-robin is fine; no trace affinity)
traceLoadBalancer:
  endpoint: "otel-lb.otel-lb.svc.cluster.local:4317"
  tls:
    insecure: true    # In-cluster. Enable mTLS in prod (see values-prod.yaml).

gateway:
  endpoint: "otel-collector.otel-collector.svc.cluster.local:4317"
  tls:
    insecure: true    # In-cluster. Enable mTLS in prod (see values-prod.yaml).

service:
  # ClusterIP so hostmetrics/own-telemetry can be scraped; pods reach
  # the agent via the host node IP (see OTEL endpoint guidance in NOTES).
  type: ClusterIP
  ports:
    otlpGrpc: 4317     # OTLP gRPC — received from local pods
    otlpHttp: 4318     # OTLP HTTP — received from local pods
    metrics: 8888      # Agent's own Prometheus metrics (scraped by Prometheus)
    healthCheck: 13133 # Health check extension

config:
  receivers:
    otlp:
      grpcEndpoint: "0.0.0.0:4317"
      httpEndpoint: "0.0.0.0:4318"

    # Tail every container's stdout/stderr on THIS node.
    # /var/log/pods is the canonical kubelet log path.
    filelog:
      include:
        - /var/log/pods/*/*/*.log
      # Skip the agent's own logs to avoid a feedback loop.
      exclude:
        - /var/log/pods/*otel-agent*/*/*.log
      startAt: end
      includeFileName: false
      includeFilePath: true

    # Node hardware metrics. This receiver MUST run per-node (DaemonSet)
    # — running it centrally would produce duplicate/incorrect data.
    hostmetrics:
      collectionInterval: 30s
      scrapers:
        cpu: true
        memory: true
        disk: true
        filesystem: true
        network: true
        load: true

  processors:
    # Batch data before exporting — reduces network calls to the gateway.
    batch:
      sendBatchSize: 1024
      timeout: 5s
    # Prevent OOM by dropping data when memory is high.
    memoryLimiter:
      checkInterval: 1s
      limitMib: 300
      spikeLimitMib: 96

  exporters:
    # Debug exporter — logs received data (dev only).
    debug:
      verbosity: basic

# hostPath mounts needed for filelog to read node log files.
logsHostPath:
  varLogPods: /var/log/pods
  varLogContainers: /var/log/containers
  # Container runtime log dir (symlink targets of /var/log/pods).
  varLibDockerContainers: /var/lib/docker/containers

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

serviceAccount:
  create: true
  name: ""

# RBAC needed by the k8sattributes processor to look up pod metadata
# (namespace, pod name, labels, owner) for enrichment.
rbac:
  create: true

podAnnotations: {}

# Run on every node, including control-plane nodes.
tolerations:
  - operator: Exists

nodeSelector: {}

affinity: {}
