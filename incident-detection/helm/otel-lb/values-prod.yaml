# ============================================================
# OTel LB — Production environment overrides
# Multiple replicas for HA, larger batches, mTLS to gateway documented.
# ============================================================

replicaCount: 3   # HA. The hash ring is identical across replicas, so
                  # agents can spray to any LB pod and traces still
                  # converge onto the correct gateway pod.

gateway:
  service: "otel-collector"
  namespace: "otel-collector"
  port: 4317
  # ── LB → Gateway TLS ────────────────────────────────────
  # Option A — In-cluster plaintext (acceptable if a service mesh
  #             such as Istio/Linkerd provides mTLS):
  #   insecure: true
  #
  # Option B — App-layer mTLS via cert-manager (recommended for
  #             high-security environments):
  #   insecure: false
  #   cert_file: /etc/otel/certs/tls.crt
  #   key_file:  /etc/otel/certs/tls.key
  #   ca_file:   /etc/otel/certs/ca.crt
  tls:
    insecure: true   # Deliberate: in-cluster traffic. See options above to enable mTLS.

config:
  processors:
    batch:
      sendBatchSize: 2048
      timeout: 10s
    memoryLimiter:
      limitMib: 600
      spikeLimitMib: 192

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
