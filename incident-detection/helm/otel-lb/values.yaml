# ============================================================
# OpenTelemetry Collector — LOAD-BALANCER mode — defaults
#
# Sits between agents and the gateway:
#   agents → otel-lb (route by trace ID) → gateway pods → backends
#
# Why it exists:
#   tail_sampling must see ALL spans of a trace on ONE gateway pod.
#   With >1 gateway replica, a plain Service round-robins spans across
#   pods and sampling sees partial traces. The loadbalancingexporter
#   with routing_key=traceID hashes each trace to a single backend pod,
#   discovered live via the k8s resolver watching the gateway endpoints.
# ============================================================

replicaCount: 2   # Stateless; scale for throughput/HA. Any replica can
                  # route any trace — the hash ring is identical on each.

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.96.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "otel-lb"

service:
  type: ClusterIP
  ports:
    otlpGrpc: 4317     # OTLP gRPC — received from agents
    otlpHttp: 4318     # OTLP HTTP — received from agents
    metrics: 8888      # LB's own Prometheus metrics (scraped by Prometheus)
    healthCheck: 13133 # Health check extension

# The gateway pool this LB fans out to. The k8s resolver watches this
# Service's Endpoints (individual pod IPs) and rebuilds the hash ring
# as gateway pods scale up/down under the HPA.
gateway:
  # Service name + namespace of the gateway (otel-collector chart).
  service: "otel-collector"
  namespace: "otel-collector"
  # Gateway OTLP gRPC port that receives the load-balanced spans.
  port: 4317
  tls:
    insecure: true    # In-cluster. Enable mTLS in prod (see values-prod.yaml).

config:
  receivers:
    otlp:
      grpcEndpoint: "0.0.0.0:4317"
      httpEndpoint: "0.0.0.0:4318"

  processors:
    batch:
      sendBatchSize: 1024
      timeout: 5s
    memoryLimiter:
      checkInterval: 1s
      limitMib: 300
      spikeLimitMib: 96

  exporters:
    debug:
      verbosity: basic

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

serviceAccount:
  create: true
  name: ""

# RBAC needed by the loadbalancingexporter k8s resolver to watch the
# gateway's Endpoints (list/watch endpoints + services).
rbac:
  create: true

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
