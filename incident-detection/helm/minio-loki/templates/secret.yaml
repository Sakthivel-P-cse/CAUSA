{{- if not .Values.auth.existingSecret }}
# Dev-only: root credentials rendered from values. In prod set
# auth.existingSecret to a pre-created Secret and this is skipped.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio-loki.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio-loki.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.rootUserKey }}: {{ .Values.auth.rootUser | quote }}
  {{ .Values.auth.rootPasswordKey }}: {{ .Values.auth.rootPassword | quote }}
{{- end }}
