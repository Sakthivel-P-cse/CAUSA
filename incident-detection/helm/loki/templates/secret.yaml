{{- if and (eq .Values.config.backend "s3") (not .Values.config.storage.existingSecret) }}
# Dev-only: S3 credentials (MinIO root creds) rendered from values.
# In prod set config.storage.existingSecret and this is skipped.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loki.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loki.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.config.storage.accessKey | quote }}
  root-password: {{ .Values.config.storage.secretKey | quote }}
{{- end }}
