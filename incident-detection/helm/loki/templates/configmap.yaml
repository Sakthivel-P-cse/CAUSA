apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loki.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loki.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: {{ .Values.config.auth_enabled }}

    server:
      http_listen_port: {{ .Values.config.server.http_listen_port }}
      grpc_listen_port: {{ .Values.config.server.grpc_listen_port }}

    common:
      path_prefix: /loki
      storage:
        {{- if eq .Values.config.backend "filesystem" }}
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
        {{- end }}
        {{- if eq .Values.config.backend "s3" }}
        s3:
          bucketnames: ${LOKI_S3_BUCKET}
          endpoint: ${LOKI_S3_ENDPOINT}
          region: ${LOKI_S3_REGION}
          access_key_id: ${LOKI_S3_ACCESS_KEY}
          secret_access_key: ${LOKI_S3_SECRET_KEY}
        {{- end }}
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: {{ .Values.config.backend }}
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: {{ .Values.config.limits_config.retention_period }}
      ingestion_rate_mb: {{ .Values.config.limits_config.ingestion_rate_mb }}
      ingestion_burst_size_mb: {{ .Values.config.limits_config.ingestion_burst_size_mb }}
      max_query_length: {{ .Values.config.limits_config.max_query_length }}

    compactor:
      working_directory: /loki/boltdb-shipper-compactor
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: {{ .Values.config.backend }}
