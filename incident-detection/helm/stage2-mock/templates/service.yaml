apiVersion: v1
kind: Service
metadata:
  # MUST be `stage2-rca` so the ingest webhook URL is identical in the explicit
  # mock profile and the default real-engine profile.
  name: stage2-rca
  namespace: {{ .Release.Namespace }}
  labels:
    app: stage2-rca
spec:
  type: ClusterIP
  selector:
    app: stage2-rca
  ports:
    - name: http
      port: 8080
      targetPort: 8080
