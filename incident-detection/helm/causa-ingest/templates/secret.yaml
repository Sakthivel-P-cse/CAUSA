{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "causa-ingest.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "causa-ingest.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Must match the postgres `causa` user's password (postgres/values.yaml
  # auth.password, dev default "causa_dev_pass"). A mismatch makes every incident
  # write raise and be swallowed while /trigger still returns 2xx — incidents
  # silently never recorded (#9). Prod sets existingSecret instead.
  PGPASSWORD: {{ .Values.env.PGPASSWORD | default "causa_dev_pass" | quote }}
  TRIGGER_AUTH_TOKEN: {{ .Values.auth.triggerToken | default "" | quote }}
  STAGE2_AUTH_TOKEN: {{ .Values.auth.stage2Token | default "" | quote }}
{{- end }}
