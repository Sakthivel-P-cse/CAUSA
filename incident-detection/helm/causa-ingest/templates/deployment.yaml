{{- if and .Values.production (not .Values.image.digest) (or (not .Values.image.tag) (eq .Values.image.tag "latest") (eq .Values.image.tag "local")) }}
{{- fail "production requires image.digest or an immutable image.tag (not local/latest)" }}
{{- end }}
{{- if and .Values.production (not .Values.existingSecret) }}
{{- fail "production requires existingSecret with PGPASSWORD, TRIGGER_AUTH_TOKEN, and STAGE2_AUTH_TOKEN" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "causa-ingest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "causa-ingest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "causa-ingest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "causa-ingest.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "causa-ingest.fullname" . }}
      # Restricted PodSecurity: run as non-root, no privilege escalation, drop
      # all caps, read-only rootfs, seccomp RuntimeDefault. Without these the pod
      # is rejected on a cluster enforcing the `restricted` PSS.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trigger
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "ingest.trigger.app"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.env }}
            {{- if ne $k "PGPASSWORD" }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            - name: TRIGGER_PORT
              value: "8080"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "causa-ingest.fullname" . }}-secret{{ end }}
                  key: PGPASSWORD
            - name: TRIGGER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "causa-ingest.fullname" . }}-secret{{ end }}
                  key: TRIGGER_AUTH_TOKEN
            - name: STAGE2_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "causa-ingest.fullname" . }}-secret{{ end }}
                  key: STAGE2_AUTH_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
