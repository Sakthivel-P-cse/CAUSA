# ============================================================
# Prometheus — Development environment overrides
# Short retention, no remote_write, local storage
# ============================================================

config:
  retention: 2d
  globalScrapeInterval: 15s
  globalEvaluationInterval: 15s
  remoteWrite:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

persistence:
  enabled: false   # emptyDir in dev
