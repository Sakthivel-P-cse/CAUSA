apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  causa-alerts-phase1.yml: |
    groups:

{{- if .Values.rules.appWorkloads.enabled }}
{{- if not (and .Values.rules.phase2.enabled .Values.rules.phase2.disablePhase1ServiceAlerts) }}
      - name: service-health
        rules:

          - alert: ServiceHighErrorRate
            expr: |
              label_replace(
                (
                  sum by (server) (
                    rate(traces_service_graph_request_failed_total{server!="flagd"}[5m])
                  )
                  /
                  sum by (server) (
                    rate(traces_service_graph_request_total{server!="flagd"}[5m])
                  )
                ) > 0.05,
                "service", "$1", "server", "(.*)"
              )
            for: 2m
            labels:
              severity: critical
              layer: service
              route: page
              namespace: {{ .Values.appNamespace | default "otel-demo" | quote }}
            annotations:
              summary: "High error rate on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                Service {{ "{{" }} $labels.service {{ "}}" }} has an error rate of
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 5%).
              runbook_url: {{ printf "%s/service-high-error-rate.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: ServiceHighErrorRateHTTP
            expr: |
              (
                label_replace(
                  (
                    sum by (job) (
                      rate(http_server_duration_milliseconds_count{http_status_code=~"5..",job!="flagd"}[5m])
                    )
                    /
                    sum by (job) (
                      rate(http_server_duration_milliseconds_count{job!="flagd"}[5m])
                    )
                  ) > 0.03,
                  "service", "$1", "job", "(.*)"
                )
              )
              or
              (
                label_replace(
                  (
                    sum by (service_name) (
                      rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..",service_name!="flagd"}[5m])
                    )
                    /
                    sum by (service_name) (
                      rate(http_server_request_duration_seconds_count{service_name!="flagd"}[5m])
                    )
                  ) > 0.03,
                  "service", "$1", "service_name", "(.*)"
                )
              )
            for: 1m
            labels:
              severity: critical
              layer: service
              route: page
              namespace: {{ .Values.appNamespace | default "otel-demo" | quote }}
            annotations:
              summary: "High HTTP 5xx rate on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                Service {{ "{{" }} $labels.service {{ "}}" }} has an HTTP 5xx
                rate of {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 3%).
              runbook_url: {{ printf "%s/service-high-error-rate.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: ServiceHighLatency
            expr: |
              label_replace(
                histogram_quantile(0.99,
                  sum by (server, le) (
                    rate(traces_service_graph_request_server_seconds_bucket[5m])
                  )
                ) > 2.0,
                "service", "$1", "server", "(.*)"
              )
            for: 2m
            labels:
              severity: warning
              layer: service
              route: ticket
              namespace: {{ .Values.appNamespace | default "otel-demo" | quote }}
            annotations:
              summary: "High p99 latency on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                p99 latency for service {{ "{{" }} $labels.service {{ "}}" }} is
                {{ "{{" }} $value | humanizeDuration {{ "}}" }} (threshold 2s).
              runbook_url: {{ printf "%s/service-high-latency.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: ServiceTrafficSpike
            expr: |
              (
                rate(traces_service_graph_request_total[5m])
                /
                avg_over_time(rate(traces_service_graph_request_total[5m])[1h:5m])
              ) > 3
            for: 2m
            labels:
              severity: warning
              layer: service
              route: ticket
            annotations:
              summary: "Traffic spike on {{ "{{" }} $labels.client {{ "}}" }} → {{ "{{" }} $labels.server {{ "}}" }}"
              description: >
                Request rate from {{ "{{" }} $labels.client {{ "}}" }} to
                {{ "{{" }} $labels.server {{ "}}" }} is
                {{ "{{" }} $value | humanize {{ "}}" }}x above the 1-hour average.
              runbook_url: {{ printf "%s/service-traffic-spike.md" .Values.rules.phase2.runbooks.baseUrl | quote }}
{{- end }}

      - name: kubernetes-workloads
        rules:

          - alert: PodCrashLooping
            expr: |
              label_replace(
                increase(kube_pod_container_status_restarts_total[15m]) > 3,
                "service", "$1", "pod", "^(.*?)-[0-9a-fA-F]{7,10}-[0-9a-zA-Z]{5}$"
              )
            for: 1m
            labels:
              severity: critical
              layer: kubernetes
              route: page
            annotations:
              summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is crash-looping"
              description: >
                Pod {{ "{{" }} $labels.pod {{ "}}" }} in namespace
                {{ "{{" }} $labels.namespace {{ "}}" }} has restarted
                {{ "{{" }} $value {{ "}}" }} times in the last 15 minutes.
              runbook_url: {{ printf "%s/pod-crash-looping.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: DeploymentReplicasUnavailable
            expr: |
              label_replace(
                kube_deployment_status_replicas_unavailable > 0,
                "service", "$1", "deployment", "(.*)"
              )
            for: 3m
            labels:
              severity: warning
              layer: kubernetes
              route: ticket
            annotations:
              summary: "Deployment {{ "{{" }} $labels.deployment {{ "}}" }} has unavailable replicas"
              description: >
                Deployment {{ "{{" }} $labels.deployment {{ "}}" }} in namespace
                {{ "{{" }} $labels.namespace {{ "}}" }} has
                {{ "{{" }} $value {{ "}}" }} unavailable replica(s) for 3+ minutes.
              runbook_url: {{ printf "%s/deployment-replicas.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

      - name: node-resources
        rules:

          - alert: NodeMemoryPressure
            expr: |
              label_replace(
                (
                  node_memory_MemAvailable_bytes
                  /
                  node_memory_MemTotal_bytes
                ) < 0.10,
                "node", "$1", "instance", "^([^:]+).*"
              )
            for: 2m
            labels:
              severity: critical
              layer: node
              route: page
            annotations:
              summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} low on memory"
              description: >
                Node {{ "{{" }} $labels.instance {{ "}}" }} has only
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} memory available
                (threshold 10%).
              runbook_url: {{ printf "%s/node-memory.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: NodeCPUSaturation
            expr: |
              label_replace(
                (
                  1 - avg by(instance)(
                    rate(node_cpu_seconds_total{mode="idle"}[5m])
                  )
                ) > 0.90,
                "node", "$1", "instance", "^([^:]+).*"
              )
            for: 5m
            labels:
              severity: warning
              layer: node
              route: ticket
            annotations:
              summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} CPU saturated"
              description: >
                Node {{ "{{" }} $labels.instance {{ "}}" }} CPU usage is at
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 90%).
              runbook_url: {{ printf "%s/node-cpu.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

      - name: container-resources
        rules:

          - alert: ContainerMemoryNearLimit
            expr: |
              label_replace(
                (
                  container_memory_usage_bytes{container!=""}
                  /
                  container_spec_memory_limit_bytes{container!=""}
                ) > 0.85,
                "service", "$1", "pod", "^(.*?)-[0-9a-fA-F]{7,10}-[0-9a-zA-Z]{5}$"
              )
            for: 2m
            labels:
              severity: warning
              layer: container
              route: ticket
            annotations:
              summary: "Container {{ "{{" }} $labels.container {{ "}}" }} near memory limit"
              description: >
                Container {{ "{{" }} $labels.container {{ "}}" }} in pod
                {{ "{{" }} $labels.pod {{ "}}" }} (namespace
                {{ "{{" }} $labels.namespace {{ "}}" }}) is using
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its memory limit.
              runbook_url: {{ printf "%s/container-memory.md" .Values.rules.phase2.runbooks.baseUrl | quote }}
{{- end }}

{{- if .Values.rules.core.enabled }}
      - name: rca-engine-health
        rules:

          - alert: RCAEngineDown
            expr: absent(up{job="stage2-rca"}) == 1
            for: 2m
            labels:
              severity: critical
              layer: rca
              route: page
              service: stage2-rca
            annotations:
              summary: "Stage 2 RCA engine is down"
              description: >
                No scrape targets for job="stage2-rca" have been seen for 2 minutes.
                Alertmanager webhooks will not trigger RCA analysis.
              runbook_url: {{ printf "%s/rca-engine-down.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: RCAEngineHighErrorRate
            expr: |
              (
                sum(rate(rca_errors_total[10m]))
                /
                sum(rate(rca_runs_total[10m]))
              ) > 0.5
            for: 5m
            labels:
              severity: warning
              layer: rca
              route: ticket
              service: stage2-rca
            annotations:
              summary: "Stage 2 RCA engine has high error rate"
              description: >
                More than 50% of RCA pipeline runs are failing over the last 10 minutes.
                Check stage2-rca pod logs for details.
              runbook_url: {{ printf "%s/rca-engine-errors.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: RCACircuitBreakerOpen
            expr: increase(rca_circuit_opens_total[15m]) > 0
            for: 0m
            labels:
              severity: warning
              layer: rca
              route: ticket
            annotations:
              summary: "RCA circuit breaker opened for {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                The per-service circuit breaker for {{ "{{" }} $labels.service {{ "}}" }}
                has opened due to consecutive RCA engine errors.  RCA analysis is
                temporarily suspended for this service.
              runbook_url: {{ printf "%s/rca-circuit-breaker.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: RCAPipelineSlowdown
            expr: |
              histogram_quantile(0.99,
                sum by (service, le) (rate(rca_duration_seconds_bucket[30m]))
              ) > 300
            for: 5m
            labels:
              severity: warning
              layer: rca
              route: ticket
            annotations:
              summary: "RCA pipeline p99 latency > 5 min for {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                The 99th-percentile RCA run duration for service
                {{ "{{" }} $labels.service {{ "}}" }} exceeds 5 minutes.
                This may indicate a slow dependency (Prometheus, Tempo, or Postgres).
              runbook_url: {{ printf "%s/rca-pipeline-slow.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

      - name: otel-collector-health
        rules:

          - alert: OtelAgentDown
            expr: absent(up{job="otel-agent"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: ingestion
              route: page
              service: otel-agent
            annotations:
              summary: "OTel agent is down (telemetry loss on one or more nodes)"
              description: >
                No healthy otel-agent scrape targets for 3 minutes. Pods on the
                affected node(s) cannot ship traces, metrics, or logs.
              runbook_url: {{ printf "%s/otel-agent-down.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: OtelGatewayDown
            expr: absent(up{job="otel-collector"} == 1)
            for: 2m
            labels:
              severity: critical
              layer: ingestion
              route: page
              service: otel-collector
            annotations:
              summary: "OTel gateway is down (all telemetry export stalled)"
              description: >
                No healthy otel-collector (gateway) scrape targets for 2 minutes.
                Agents have nowhere to forward to; nothing reaches storage.
              runbook_url: {{ printf "%s/otel-gateway-down.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: OtelLbDown
            expr: absent(up{job="otel-lb"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: ingestion
              route: page
              service: otel-lb
            annotations:
              summary: "OTel LB is down (trace ingestion stalled)"
              description: >
                No healthy otel-lb scrape targets for 3 minutes. Agents cannot
                forward traces to the gateway with trace-ID affinity, so no new
                traces reach Tempo. Metrics and logs are unaffected.
              runbook_url: {{ printf "%s/otel-lb-down.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: OtelExporterSendFailures
            expr: sum(rate(otelcol_exporter_send_failed_spans[5m])) > 0
            for: 5m
            labels:
              severity: warning
              layer: ingestion
              route: ticket
              service: otel-collector
            annotations:
              summary: "OTel collector is failing to export spans"
              description: >
                otelcol_exporter_send_failed_spans is nonzero over 5 minutes —
                spans are being dropped on export. Check the downstream backend
                (Tempo) and the gateway's exporter queue.
              runbook_url: {{ printf "%s/otel-exporter-failures.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: OtelProcessorRefusingData
            expr: sum(rate(otelcol_processor_refused_spans[5m])) > 0
            for: 5m
            labels:
              severity: warning
              layer: ingestion
              route: ticket
              service: otel-collector
            annotations:
              summary: "OTel collector is refusing spans (backpressure)"
              description: >
                otelcol_processor_refused_spans is nonzero over 5 minutes — the
                memory_limiter is shedding load. Scale the gateway (HPA) or raise
                its memory limit.
              runbook_url: {{ printf "%s/otel-backpressure.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

      - name: mimir-health
        rules:

          - alert: MimirDown
            expr: absent(up{job="mimir"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: metrics-longterm
              route: page
              service: mimir
            annotations:
              summary: "Mimir is down (long-term metric storage unavailable)"
              description: >
                No healthy mimir scrape targets for 3 minutes. Prometheus
                remote_write has nowhere to ship samples; long-term metrics
                and their queries are unavailable.
              runbook_url: {{ printf "%s/mimir-down.md" .Values.rules.phase2.runbooks.baseUrl | quote }}

          - alert: PrometheusRemoteWriteFailing
            expr: |
              rate(prometheus_remote_storage_samples_failed_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
              layer: metrics-longterm
              route: ticket
              service: prometheus
            annotations:
              summary: "Prometheus remote_write to Mimir is failing"
              description: >
                prometheus_remote_storage_samples_failed_total is increasing —
                samples are being dropped on the way to Mimir. Check Mimir health,
                the X-Scope-OrgID tenant header, and MinIO (S3) availability.
              runbook_url: {{ printf "%s/prometheus-remote-write.md" .Values.rules.phase2.runbooks.baseUrl | quote }}
{{- end }}

{{- if and .Values.rules.phase2.enabled .Values.rules.phase2.slo.enabled }}
{{- $ns := .Values.appNamespace | default "otel-demo" }}
{{- $svcRegex := .Values.rules.phase2.slo.services | join "|" }}
{{- $target := .Values.rules.phase2.slo.availabilityTarget | float64 }}
{{- $budget := subf 1.0 $target }}
{{- $sloPct := printf "%.1f" (mulf $target 100.0) }}
{{- $runbook := printf "%s/slo-burn-rate.md" .Values.rules.phase2.runbooks.baseUrl }}
{{- $latFast := .Values.rules.phase2.slo.latencyFastSeconds | default 2.0 }}
{{- $latSlow := .Values.rules.phase2.slo.latencySlowSeconds | default 1.5 }}
  causa-slo-recording.yml: |
    groups:
      - name: causa-slo-recording
        interval: 30s
        rules:
{{- range $w := list "5m" "30m" "1h" "6h" }}
          - record: causa:sli_error_ratio:ratio{{ $w }}
            expr: |
              label_replace(
                (
                  sum by (server) (
                    rate(traces_service_graph_request_failed_total{server=~"{{ $svcRegex }}"}[{{ $w }}])
                  )
                  /
                  clamp_min(
                    sum by (server) (
                      rate(traces_service_graph_request_total{server=~"{{ $svcRegex }}"}[{{ $w }}])
                    ),
                    1
                  )
                ),
                "service", "$1", "server", "(.*)"
              )
          - record: causa:sli_availability:ratio{{ $w }}
            expr: |
              1 - causa:sli_error_ratio:ratio{{ $w }}
          - record: causa:slo_availability:burn_rate_{{ $w }}
            expr: |
              causa:sli_error_ratio:ratio{{ $w }} / {{ $budget }}
          - record: causa:sli_latency:p99_{{ $w }}
            expr: |
              label_replace(
                histogram_quantile(0.99,
                  sum by (server, le) (
                    rate(traces_service_graph_request_server_seconds_bucket{server=~"{{ $svcRegex }}"}[{{ $w }}])
                  )
                ),
                "service", "$1", "server", "(.*)"
              )
{{- end }}

  causa-slo-burn.yml: |
    groups:
      - name: causa-slo-burn
        rules:
          - alert: SLOAvailabilityFastBurn
            expr: |
              (
                causa:slo_availability:burn_rate_5m > 14.4
              )
              and
              (
                causa:slo_availability:burn_rate_1h > 14.4
              )
            for: 2m
            labels:
              severity: critical
              layer: slo
              route: page
              namespace: {{ $ns | quote }}
              slo_target: {{ $sloPct | quote }}
            annotations:
              summary: "Fast availability burn on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                Service {{ "{{" }} $labels.service {{ "}}" }} is burning the
                {{ $sloPct }}% availability error budget at >14.4x (5m+1h windows).
                Current burn={{ "{{" }} $value | humanize {{ "}}" }}.
              runbook_url: {{ $runbook | quote }}

          - alert: SLOAvailabilitySlowBurn
            expr: |
              (
                causa:slo_availability:burn_rate_30m > 6
              )
              and
              (
                causa:slo_availability:burn_rate_6h > 6
              )
            for: 15m
            labels:
              severity: warning
              layer: slo
              route: ticket
              namespace: {{ $ns | quote }}
              slo_target: {{ $sloPct | quote }}
            annotations:
              summary: "Slow availability burn on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                Service {{ "{{" }} $labels.service {{ "}}" }} is burning the
                {{ $sloPct }}% availability error budget at >6x (30m+6h windows).
              runbook_url: {{ $runbook | quote }}

          - alert: SLOLatencyFastBurn
            expr: |
              (
                causa:sli_latency:p99_5m > {{ $latFast }}
              )
              and
              (
                causa:sli_latency:p99_1h > {{ $latFast }}
              )
            for: 2m
            labels:
              severity: critical
              layer: slo
              route: page
              namespace: {{ $ns | quote }}
            annotations:
              summary: "Fast latency burn on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                Service {{ "{{" }} $labels.service {{ "}}" }} p99 latency is above
                {{ $latFast }}s in both 5m and 1h windows
                ({{ "{{" }} $value | humanizeDuration {{ "}}" }}).
              runbook_url: {{ $runbook | quote }}

          - alert: SLOLatencySlowBurn
            expr: |
              (
                causa:sli_latency:p99_30m > {{ $latSlow }}
              )
              and
              (
                causa:sli_latency:p99_6h > {{ $latSlow }}
              )
            for: 15m
            labels:
              severity: warning
              layer: slo
              route: ticket
              namespace: {{ $ns | quote }}
            annotations:
              summary: "Slow latency burn on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                Service {{ "{{" }} $labels.service {{ "}}" }} p99 latency is above
                {{ $latSlow }}s in both 30m and 6h windows.
              runbook_url: {{ $runbook | quote }}
{{- end }}

{{- if and .Values.rules.phase2.enabled .Values.rules.phase2.dependencies.enabled }}
{{- $ns := .Values.appNamespace | default "otel-demo" }}
{{- $depRunbook := printf "%s/dependency-sli.md" .Values.rules.phase2.runbooks.baseUrl }}
  causa-dependencies.yml: |
    groups:
      - name: causa-dependencies
        rules:

          - alert: DependencyKafkaUnavailable
            expr: |
              label_replace(
                kube_deployment_status_replicas_unavailable{namespace="{{ $ns }}",deployment="kafka"} > 0,
                "service", "$1", "deployment", "(.*)"
              )
            for: 2m
            labels:
              severity: critical
              layer: dependency
              route: page
              namespace: {{ $ns | quote }}
            annotations:
              summary: "Kafka deployment has unavailable replicas"
              description: >
                kafka in {{ $ns }} has {{ "{{" }} $value {{ "}}" }} unavailable replica(s).
              runbook_url: {{ $depRunbook | quote }}

          - alert: DependencyPostgresUnavailable
            expr: |
              label_replace(
                kube_deployment_status_replicas_unavailable{namespace="{{ $ns }}",deployment="postgresql"} > 0,
                "service", "$1", "deployment", "(.*)"
              )
            for: 2m
            labels:
              severity: critical
              layer: dependency
              route: page
              namespace: {{ $ns | quote }}
            annotations:
              summary: "PostgreSQL deployment has unavailable replicas"
              description: >
                postgresql in {{ $ns }} has {{ "{{" }} $value {{ "}}" }} unavailable replica(s).
              runbook_url: {{ $depRunbook | quote }}

          - alert: DependencyValkeyUnavailable
            expr: |
              label_replace(
                kube_deployment_status_replicas_unavailable{namespace="{{ $ns }}",deployment="valkey-cart"} > 0,
                "service", "$1", "deployment", "(.*)"
              )
            for: 2m
            labels:
              severity: critical
              layer: dependency
              route: page
              namespace: {{ $ns | quote }}
            annotations:
              summary: "Valkey cart cache has unavailable replicas"
              description: >
                valkey-cart in {{ $ns }} has {{ "{{" }} $value {{ "}}" }} unavailable replica(s).
              runbook_url: {{ $depRunbook | quote }}

          - alert: DependencyKafkaHighErrorRate
            expr: |
              label_replace(
                (
                  sum by (server) (rate(traces_service_graph_request_failed_total{server="kafka"}[5m]))
                  /
                  clamp_min(sum by (server) (rate(traces_service_graph_request_total{server="kafka"}[5m])), 1)
                ) > 0.05,
                "service", "$1", "server", "(.*)"
              )
            for: 5m
            labels:
              severity: warning
              layer: dependency
              route: ticket
              namespace: {{ $ns | quote }}
            annotations:
              summary: "High error rate calling Kafka"
              description: >
                Trace-graph error rate to kafka is
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 5%).
              runbook_url: {{ $depRunbook | quote }}

          - alert: DependencyPostgresHighLatency
            expr: |
              label_replace(
                histogram_quantile(0.99,
                  sum by (server, le) (
                    rate(traces_service_graph_request_server_seconds_bucket{server="postgresql"}[5m])
                  )
                ) > 1.0,
                "service", "$1", "server", "(.*)"
              )
            for: 5m
            labels:
              severity: warning
              layer: dependency
              route: ticket
              namespace: {{ $ns | quote }}
            annotations:
              summary: "High p99 latency to PostgreSQL"
              description: >
                p99 latency to postgresql is
                {{ "{{" }} $value | humanizeDuration {{ "}}" }} (threshold 1s).
              runbook_url: {{ $depRunbook | quote }}

          - alert: DependencyValkeyTimeouts
            expr: |
              label_replace(
                (
                  sum by (server) (rate(traces_service_graph_request_failed_total{server="valkey-cart"}[5m]))
                  /
                  clamp_min(sum by (server) (rate(traces_service_graph_request_total{server="valkey-cart"}[5m])), 1)
                ) > 0.05,
                "service", "$1", "server", "(.*)"
              )
            for: 5m
            labels:
              severity: warning
              layer: dependency
              route: ticket
              namespace: {{ $ns | quote }}
            annotations:
              summary: "High failure rate calling Valkey cart cache"
              description: >
                Trace-graph error rate to valkey-cart is
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 5%).
              runbook_url: {{ $depRunbook | quote }}

          - alert: DependencyFlagdHighErrorRate
            expr: |
              label_replace(
                (
                  sum by (server) (rate(traces_service_graph_request_failed_total{server="flagd"}[5m]))
                  /
                  clamp_min(sum by (server) (rate(traces_service_graph_request_total{server="flagd"}[5m])), 1)
                ) > 0.10,
                "service", "$1", "server", "(.*)"
              )
            for: 5m
            labels:
              severity: warning
              layer: dependency
              route: ticket
              namespace: {{ $ns | quote }}
            annotations:
              summary: "High error rate on flagd (ticket only)"
              description: >
                flagd error rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }}.
                Ticket route — do not treat flagd as shop root cause.
              runbook_url: {{ $depRunbook | quote }}

          - alert: FrontendProxyUpstreamErrors
            expr: |
              (
                label_replace(
                  (
                    sum by (job) (
                      rate(http_server_duration_milliseconds_count{http_status_code=~"5..",job="frontend-proxy"}[5m])
                    )
                    /
                    clamp_min(
                      sum by (job) (
                        rate(http_server_duration_milliseconds_count{job="frontend-proxy"}[5m])
                      ),
                      1
                    )
                  ) > 0.03,
                  "service", "$1", "job", "(.*)"
                )
              )
              or
              (
                label_replace(
                  (
                    sum by (service_name) (
                      rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..",service_name="frontend-proxy"}[5m])
                    )
                    /
                    clamp_min(
                      sum by (service_name) (
                        rate(http_server_request_duration_seconds_count{service_name="frontend-proxy"}[5m])
                      ),
                      1
                    )
                  ) > 0.03,
                  "service", "$1", "service_name", "(.*)"
                )
              )
            for: 2m
            labels:
              severity: critical
              layer: dependency
              route: page
              namespace: {{ $ns | quote }}
            annotations:
              summary: "Frontend proxy upstream 5xx rate high"
              description: >
                frontend-proxy HTTP 5xx rate is
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 3%).
              runbook_url: {{ $depRunbook | quote }}
{{- end }}

{{- if and .Values.rules.phase2.enabled .Values.rules.phase2.platform.enabled }}
{{- $platRunbook := printf "%s/platform-health.md" .Values.rules.phase2.runbooks.baseUrl }}
{{- $ns := .Values.appNamespace | default "otel-demo" }}
  causa-platform.yml: |
    groups:
      - name: causa-platform
        rules:

          - alert: PrometheusTargetDown
            expr: |
              up{job!~"prometheus"} == 0
            for: 5m
            labels:
              severity: critical
              layer: platform
              route: page
              service: prometheus
            annotations:
              summary: "Prometheus target down ({{ "{{" }} $labels.job {{ "}}" }})"
              description: >
                Scrape target job={{ "{{" }} $labels.job {{ "}}" }} instance={{ "{{" }} $labels.instance {{ "}}" }}
                has been down for 5 minutes.
              runbook_url: {{ $platRunbook | quote }}

          - alert: PrometheusScrapeFailureHigh
            expr: |
              rate(prometheus_target_scrapes_exceeded_sample_limit_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
              layer: platform
              route: ticket
              service: prometheus
            annotations:
              summary: "Prometheus scrape sample limit exceeded"
              description: >
                Targets are hitting sample scrape limits — cardinality may be too high.
              runbook_url: {{ $platRunbook | quote }}

          - alert: PrometheusRuleEvalFailure
            expr: |
              increase(prometheus_rule_evaluation_failures_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
              layer: platform
              route: ticket
              service: prometheus
            annotations:
              summary: "Prometheus rule evaluation failures"
              description: >
                prometheus_rule_evaluation_failures_total increased in the last 5m.
                Check rule syntax and metric availability.
              runbook_url: {{ $platRunbook | quote }}

          - alert: LokiDown
            expr: absent(up{job="loki"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: platform
              route: page
              service: loki
            annotations:
              summary: "Loki is down"
              description: No healthy loki scrape targets for 3 minutes.
              runbook_url: {{ $platRunbook | quote }}

          - alert: TempoDown
            expr: absent(up{job="tempo"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: platform
              route: page
              service: tempo
            annotations:
              summary: "Tempo is down"
              description: No healthy tempo scrape targets for 3 minutes.
              runbook_url: {{ $platRunbook | quote }}

          - alert: MinioBackendDown
            expr: |
              absent(up{job=~"minio-loki|minio-tempo|minio-mimir"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: platform
              route: page
              service: minio
            annotations:
              summary: "MinIO backend unavailable"
              description: >
                One or more MinIO scrape jobs (loki/tempo/mimir) are absent.
              runbook_url: {{ $platRunbook | quote }}

          - alert: AlertmanagerNotificationFailing
            expr: |
              rate(alertmanager_notifications_failed_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
              layer: platform
              route: ticket
              service: alertmanager
            annotations:
              summary: "Alertmanager notifications failing"
              description: >
                alertmanager_notifications_failed_total is increasing — webhook
                delivery to causa-ingest may be broken.
              runbook_url: {{ $platRunbook | quote }}

          - alert: ContainerCPUThrottled
            expr: |
              label_replace(
                sum by (pod, namespace) (
                  rate(container_cpu_cfs_throttled_seconds_total{container!="",namespace="{{ $ns }}"}[5m])
                ) > 0.05,
                "service", "$1", "pod", "^(.*?)-[0-9a-fA-F]{7,10}-[0-9a-zA-Z]{5}$"
              )
            for: 10m
            labels:
              severity: warning
              layer: platform
              route: ticket
              namespace: {{ $ns | quote }}
            annotations:
              summary: "Container CPU throttled on {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                Pod {{ "{{" }} $labels.pod {{ "}}" }} is being CPU-throttled
                ({{ "{{" }} $value | humanize {{ "}}" }}s/s).
              runbook_url: {{ $platRunbook | quote }}

          - alert: PersistentVolumeFillingUp
            expr: |
              (
                kubelet_volume_stats_available_bytes
                /
                kubelet_volume_stats_capacity_bytes
              ) < 0.15
            for: 10m
            labels:
              severity: warning
              layer: platform
              route: ticket
              service: storage
            annotations:
              summary: "Persistent volume filling up"
              description: >
                Volume {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} has less than
                15% free space.
              runbook_url: {{ $platRunbook | quote }}

          - alert: KubePodNotReady
            expr: |
              label_replace(
                kube_pod_status_phase{phase="Pending",namespace="{{ $ns }}"} == 1,
                "service", "$1", "pod", "^(.*?)-[0-9a-fA-F]{7,10}-[0-9a-zA-Z]{5}$"
              )
            for: 10m
            labels:
              severity: warning
              layer: platform
              route: ticket
              namespace: {{ $ns | quote }}
            annotations:
              summary: "Pod stuck Pending: {{ "{{" }} $labels.pod {{ "}}" }}"
              description: >
                Pod {{ "{{" }} $labels.pod {{ "}}" }} has been Pending for 10+ minutes.
              runbook_url: {{ $platRunbook | quote }}

          - alert: KubeJobFailed
            expr: |
              kube_job_failed > 0
            for: 5m
            labels:
              severity: warning
              layer: platform
              route: ticket
              service: jobs
            annotations:
              summary: "Kubernetes Job failed: {{ "{{" }} $labels.job_name {{ "}}" }}"
              description: >
                Job {{ "{{" }} $labels.job_name {{ "}}" }} in
                {{ "{{" }} $labels.namespace {{ "}}" }} has failed.
              runbook_url: {{ $platRunbook | quote }}

          - alert: HPAReplicasMaxed
            expr: |
              label_replace(
                (
                  kube_horizontalpodautoscaler_status_current_replicas
                  ==
                  kube_horizontalpodautoscaler_spec_max_replicas
                )
                and
                (
                  kube_horizontalpodautoscaler_spec_max_replicas > 1
                ),
                "service", "$1", "horizontalpodautoscaler", "(.*)"
              )
            for: 15m
            labels:
              severity: warning
              layer: platform
              route: ticket
            annotations:
              summary: "HPA at max replicas: {{ "{{" }} $labels.horizontalpodautoscaler {{ "}}" }}"
              description: >
                HPA {{ "{{" }} $labels.horizontalpodautoscaler {{ "}}" }} has been at
                max replicas for 15+ minutes.
              runbook_url: {{ $platRunbook | quote }}
{{- end }}
