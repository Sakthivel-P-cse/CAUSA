apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  causa-alerts.yml: |
    groups:

{{- if .Values.rules.appWorkloads.enabled }}
      # ────────────────────────────────────────────────────────────
      # GROUP 1 — Service-level alerts (from Tempo span metrics)
      # These fire when a service is misbehaving at the
      # application layer. Source: Tempo metrics_generator
      # → remote_write → Prometheus
      # ────────────────────────────────────────────────────────────
      - name: service-health
        rules:

          # Error rate > 5% for 2 minutes
          # Stage 2 failure type: Cascading failure, External dependency failure
          # Uses Tempo service-graph metrics (traces_service_graph_request_*) which
          # are generated by Tempo metrics_generator and remote-written to Prometheus.
          # The ``server`` label identifies the service receiving the requests.
          - alert: ServiceHighErrorRate
            expr: |
              label_replace(
                (
                  sum by (server) (rate(traces_service_graph_request_failed_total[5m]))
                  /
                  sum by (server) (rate(traces_service_graph_request_total[5m]))
                ) > 0.05,
                "service", "$1", "server", "(.*)"
              )
            for: 2m
            labels:
              severity: critical
              layer: service
              namespace: {{ .Values.appNamespace | default "otel-demo" | quote }}
            annotations:
              summary: "High error rate on {{ "{{" }} $labels.server {{ "}}" }}"
              description: >
                Service {{ "{{" }} $labels.server {{ "}}" }} has an error rate of
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 5%).

          # p99 latency > 2 seconds for 2 minutes
          # Stage 2 failure type: Cascading failure, Resource exhaustion, Traffic overload
          - alert: ServiceHighLatency
            expr: |
              label_replace(
                histogram_quantile(0.99,
                  sum by (server, le) (
                    rate(traces_service_graph_request_server_seconds_bucket[5m])
                  )
                ) > 2.0,
                "service", "$1", "server", "(.*)"
              )
            for: 2m
            labels:
              severity: warning
              layer: service
              namespace: {{ .Values.appNamespace | default "otel-demo" | quote }}
            annotations:
              summary: "High p99 latency on {{ "{{" }} $labels.server {{ "}}" }}"
              description: >
                p99 latency for service {{ "{{" }} $labels.server {{ "}}" }} is
                {{ "{{" }} $value | humanizeDuration {{ "}}" }} (threshold 2s).

          # Request rate 3x above 1-hour baseline for 2 minutes
          # Stage 2 failure type: Traffic overload
          - alert: ServiceTrafficSpike
            expr: |
              (
                rate(traces_service_graph_request_total[5m])
                /
                avg_over_time(rate(traces_service_graph_request_total[5m])[1h:5m])
              ) > 3
            for: 2m
            labels:
              severity: warning
              layer: service
            annotations:
              summary: "Traffic spike on {{ "{{" }} $labels.client {{ "}}" }} → {{ "{{" }} $labels.server {{ "}}" }}"
              description: >
                Request rate from {{ "{{" }} $labels.client {{ "}}" }} to
                {{ "{{" }} $labels.server {{ "}}" }} is
                {{ "{{" }} $value | humanize {{ "}}" }}x above the 1-hour average.

      # ────────────────────────────────────────────────────────────
      # GROUP 2 — Pod and deployment alerts (from kube-state-metrics)
      # Stage 2 failure type: Infrastructure failure, Configuration error
      # ────────────────────────────────────────────────────────────
      - name: kubernetes-workloads
        rules:

          # Pod restarted > 3 times in 15 minutes
          # label_replace copies the container name to a ``service`` label so
          # Stage 2 can resolve the alerted service from the webhook payload.
          - alert: PodCrashLooping
            expr: |
              label_replace(
                increase(kube_pod_container_status_restarts_total[15m]) > 3,
                "service", "$1", "pod", "^(.*?)-[0-9a-fA-F]{7,10}-[0-9a-zA-Z]{5}$"
              )
            for: 1m
            labels:
              severity: critical
              layer: kubernetes
            annotations:
              summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is crash-looping"
              description: >
                Pod {{ "{{" }} $labels.pod {{ "}}" }} in namespace
                {{ "{{" }} $labels.namespace {{ "}}" }} has restarted
                {{ "{{" }} $value {{ "}}" }} times in the last 15 minutes.

          # Deployment has unavailable replicas for 3 minutes
          # label_replace copies the deployment name to a ``service`` label.
          - alert: DeploymentReplicasUnavailable
            expr: |
              label_replace(
                kube_deployment_status_replicas_unavailable > 0,
                "service", "$1", "deployment", "(.*)"
              )
            for: 3m
            labels:
              severity: warning
              layer: kubernetes
            annotations:
              summary: "Deployment {{ "{{" }} $labels.deployment {{ "}}" }} has unavailable replicas"
              description: >
                Deployment {{ "{{" }} $labels.deployment {{ "}}" }} in namespace
                {{ "{{" }} $labels.namespace {{ "}}" }} has
                {{ "{{" }} $value {{ "}}" }} unavailable replica(s) for 3+ minutes.

      # ────────────────────────────────────────────────────────────
      # GROUP 3 — Node hardware alerts (from node-exporter)
      # Stage 2 failure type: Resource exhaustion
      # ────────────────────────────────────────────────────────────
      - name: node-resources
        rules:

          # Node has < 10% memory available for 2 minutes
          - alert: NodeMemoryPressure
            expr: |
              label_replace(
                (
                  node_memory_MemAvailable_bytes
                  /
                  node_memory_MemTotal_bytes
                ) < 0.10,
                "node", "$1", "instance", "^([^:]+).*"
              )
            for: 2m
            labels:
              severity: critical
              layer: node
            annotations:
              summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} low on memory"
              description: >
                Node {{ "{{" }} $labels.instance {{ "}}" }} has only
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} memory available
                (threshold 10%).

          # Node CPU usage > 90% for 5 minutes
          - alert: NodeCPUSaturation
            expr: |
              label_replace(
                (
                  1 - avg by(instance)(
                    rate(node_cpu_seconds_total{mode="idle"}[5m])
                  )
                ) > 0.90,
                "node", "$1", "instance", "^([^:]+).*"
              )
            for: 5m
            labels:
              severity: warning
              layer: node
            annotations:
              summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} CPU saturated"
              description: >
                Node {{ "{{" }} $labels.instance {{ "}}" }} CPU usage is at
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold 90%).

      # ────────────────────────────────────────────────────────────
      # GROUP 4 — Container resource alerts (from cAdvisor)
      # Stage 2 failure type: Resource exhaustion
      # ────────────────────────────────────────────────────────────
      - name: container-resources
        rules:

          # Container using > 85% of its memory limit for 2 minutes
          # label_replace copies the container name to a ``service`` label.
          - alert: ContainerMemoryNearLimit
            expr: |
              label_replace(
                (
                  container_memory_usage_bytes{container!=""}
                  /
                  container_spec_memory_limit_bytes{container!=""}
                ) > 0.85,
                "service", "$1", "pod", "^(.*?)-[0-9a-fA-F]{7,10}-[0-9a-zA-Z]{5}$"
              )
            for: 2m
            labels:
              severity: warning
              layer: container
            annotations:
              summary: "Container {{ "{{" }} $labels.container {{ "}}" }} near memory limit"
              description: >
                Container {{ "{{" }} $labels.container {{ "}}" }} in pod
                {{ "{{" }} $labels.pod {{ "}}" }} (namespace
                {{ "{{" }} $labels.namespace {{ "}}" }}) is using
                {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its memory limit.

      # ────────────────────────────────────────────────────────────
      # GROUP 5 — Stage 2 RCA Engine self-health
      # These alerts fire when the RCA pipeline itself is unhealthy.
      # Source: prometheus_client metrics exposed at :8080/metrics
      # ────────────────────────────────────────────────────────────
{{- end }}

{{- if .Values.rules.core.enabled }}
      - name: rca-engine-health
        rules:

          # RCA engine pod is not present in the cluster
          - alert: RCAEngineDown
            expr: absent(up{job="stage2-rca"}) == 1
            for: 2m
            labels:
              severity: critical
              layer: rca
            annotations:
              summary: "Stage 2 RCA engine is down"
              description: >
                No scrape targets for job="stage2-rca" have been seen for 2 minutes.
                Alertmanager webhooks will not trigger RCA analysis.

          # RCA engine error rate > 50% over the last 10 minutes
          - alert: RCAEngineHighErrorRate
            expr: |
              (
                sum(rate(rca_errors_total[10m]))
                /
                sum(rate(rca_runs_total[10m]))
              ) > 0.5
            for: 5m
            labels:
              severity: warning
              layer: rca
            annotations:
              summary: "Stage 2 RCA engine has high error rate"
              description: >
                More than 50% of RCA pipeline runs are failing over the last 10 minutes.
                Check stage2-rca pod logs for details.

          # RCA circuit breaker opened for a service
          - alert: RCACircuitBreakerOpen
            expr: increase(rca_circuit_opens_total[15m]) > 0
            for: 0m
            labels:
              severity: warning
              layer: rca
            annotations:
              summary: "RCA circuit breaker opened for {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                The per-service circuit breaker for {{ "{{" }} $labels.service {{ "}}" }}
                has opened due to consecutive RCA engine errors.  RCA analysis is
                temporarily suspended for this service.

          # RCA p99 latency > 5 minutes — pipeline is stalling
          - alert: RCAPipelineSlowdown
            expr: |
              histogram_quantile(0.99,
                sum by (service, le) (rate(rca_duration_seconds_bucket[30m]))
              ) > 300
            for: 5m
            labels:
              severity: warning
              layer: rca
            annotations:
              summary: "RCA pipeline p99 latency > 5 min for {{ "{{" }} $labels.service {{ "}}" }}"
              description: >
                The 99th-percentile RCA run duration for service
                {{ "{{" }} $labels.service {{ "}}" }} exceeds 5 minutes.
                This may indicate a slow dependency (Prometheus, Tempo, or Postgres).

      # ────────────────────────────────────────────────────────────
      # GROUP 6 — OTel ingestion tier self-health (agent + gateway)
      # The collector is part of the observability platform, so it must
      # itself be observable. Source: collector telemetry on :8888
      # (otelcol_* metrics), scraped via the otel-agent / otel-collector
      # jobs. If these fire, telemetry is being DROPPED before it lands.
      # ────────────────────────────────────────────────────────────
      - name: otel-collector-health
        rules:

          # A per-node agent is missing — that node's logs/metrics/traces
          # are not being collected or forwarded.
          - alert: OtelAgentDown
            expr: absent(up{job="otel-agent"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: ingestion
            annotations:
              summary: "OTel agent is down (telemetry loss on one or more nodes)"
              description: >
                No healthy otel-agent scrape targets for 3 minutes. Pods on the
                affected node(s) cannot ship traces, metrics, or logs.

          # Gateway is absent — the entire ingestion path to the backends
          # (Tempo/Prometheus/Loki) is broken.
          - alert: OtelGatewayDown
            expr: absent(up{job="otel-collector"} == 1)
            for: 2m
            labels:
              severity: critical
              layer: ingestion
            annotations:
              summary: "OTel gateway is down (all telemetry export stalled)"
              description: >
                No healthy otel-collector (gateway) scrape targets for 2 minutes.
                Agents have nowhere to forward to; nothing reaches storage.

          # LB tier is absent — trace ingestion stalls (metrics/logs still
          # flow, since those bypass the LB and go to the gateway directly).
          - alert: OtelLbDown
            expr: absent(up{job="otel-lb"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: ingestion
            annotations:
              summary: "OTel LB is down (trace ingestion stalled)"
              description: >
                No healthy otel-lb scrape targets for 3 minutes. Agents cannot
                forward traces to the gateway with trace-ID affinity, so no new
                traces reach Tempo. Metrics and logs are unaffected.

          # The exporter is failing to send spans downstream — data loss.
          - alert: OtelExporterSendFailures
            expr: sum(rate(otelcol_exporter_send_failed_spans[5m])) > 0
            for: 5m
            labels:
              severity: warning
              layer: ingestion
            annotations:
              summary: "OTel collector is failing to export spans"
              description: >
                otelcol_exporter_send_failed_spans is nonzero over 5 minutes —
                spans are being dropped on export. Check the downstream backend
                (Tempo) and the gateway's exporter queue.

          # The pipeline is refusing data — memory_limiter is shedding load.
          - alert: OtelProcessorRefusingData
            expr: sum(rate(otelcol_processor_refused_spans[5m])) > 0
            for: 5m
            labels:
              severity: warning
              layer: ingestion
            annotations:
              summary: "OTel collector is refusing spans (backpressure)"
              description: >
                otelcol_processor_refused_spans is nonzero over 5 minutes — the
                memory_limiter is shedding load. Scale the gateway (HPA) or raise
                its memory limit.

      # ────────────────────────────────────────────────────────────
      # GROUP 7 — Metrics scale-out tier (Mimir long-term storage)
      # Prometheus remote_writes every sample to Mimir. If Mimir is
      # down or the write path is failing, long-term metrics are lost
      # even though local (short-retention) Prometheus still works.
      # ────────────────────────────────────────────────────────────
      - name: mimir-health
        rules:

          # Mimir is absent — long-term metric storage is unavailable.
          - alert: MimirDown
            expr: absent(up{job="mimir"} == 1)
            for: 3m
            labels:
              severity: critical
              layer: metrics-longterm
            annotations:
              summary: "Mimir is down (long-term metric storage unavailable)"
              description: >
                No healthy mimir scrape targets for 3 minutes. Prometheus
                remote_write has nowhere to ship samples; long-term metrics
                and their queries are unavailable.

          # Prometheus is failing to ship samples to Mimir — data loss on
          # the long-term path. Source: Prometheus' own remote_write metrics.
          - alert: PrometheusRemoteWriteFailing
            expr: |
              rate(prometheus_remote_storage_samples_failed_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
              layer: metrics-longterm
            annotations:
              summary: "Prometheus remote_write to Mimir is failing"
              description: >
                prometheus_remote_storage_samples_failed_total is increasing —
                samples are being dropped on the way to Mimir. Check Mimir health,
                the X-Scope-OrgID tenant header, and MinIO (S3) availability.
{{- end }}


