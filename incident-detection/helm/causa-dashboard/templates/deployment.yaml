{{- if and .Values.production (not .Values.image.digest) (or (not .Values.image.tag) (eq .Values.image.tag "latest") (eq .Values.image.tag "local")) }}
{{- fail "production requires image.digest or an immutable image.tag (not local/latest)" }}
{{- end }}
{{- if not .Values.existingSecret }}
{{- fail "existingSecret is required and must contain dashboard and database credentials" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: causa-dashboard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: causa-dashboard
  template:
    metadata:
      labels:
        app: causa-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "dashboard.backend.main:app", "--host", "0.0.0.0", "--port", "8090"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8090
              name: http
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key := list "PGPASSWORD" "REMEDIATION_PGPASSWORD" "CAUSA_API_VIEWER_TOKEN" "CAUSA_REMEDIATION_PROPOSER_TOKEN" "REMEDIATION_APPROVAL_TOKEN" "CAUSA_REMEDIATION_EXECUTOR_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: causa-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: causa-dashboard
spec:
  type: {{ .Values.service.type }}
  selector:
    app: causa-dashboard
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
