apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: causa-dashboard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: causa-dashboard
  template:
    metadata:
      labels:
        app: causa-dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "eval.dashboard_app"]
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: CAUSA_EVAL_DSN
              value: "host={{ .Values.postgres.host }} port={{ .Values.postgres.port }} dbname={{ .Values.postgres.database }} user={{ .Values.postgres.user }} password={{ .Values.postgres.password }}"
            - name: DASHBOARD_PORT
              value: "8090"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: causa-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: causa-dashboard
spec:
  type: {{ .Values.service.type }}
  selector:
    app: causa-dashboard
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
