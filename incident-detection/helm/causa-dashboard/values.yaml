image:
  repository: causa/stage2-rca
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8090

postgres:
  host: postgres.postgres.svc.cluster.local
  port: 5432
  database: causa
  user: causa_eval
  password: causa_eval

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
