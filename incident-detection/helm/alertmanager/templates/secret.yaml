{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alertmanager.fullname" . }}-webhook-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alertmanager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.tokenKey }}: {{ required "auth.triggerToken is required when auth.existingSecret is empty" .Values.auth.triggerToken | quote }}
{{- end }}
