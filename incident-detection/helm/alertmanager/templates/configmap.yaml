apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alertmanager.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alertmanager.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: stage2-rca-webhook
      group_by: ['alertname', 'service', 'namespace']
      group_wait:      {{ .Values.config.groupWait }}
      group_interval:  {{ .Values.config.groupInterval }}
      repeat_interval: {{ .Values.config.repeatInterval }}

      routes:
        - matchers:
            - route="page"
          receiver: stage2-rca-webhook
          group_wait: 0s
          continue: false

        - matchers:
            - severity="critical"
          receiver: stage2-rca-webhook
          group_wait: 0s
          continue: true

        - matchers:
            - route="ticket"
          receiver: stage2-rca-webhook
          group_wait: 30s
          continue: false

    receivers:
      - name: stage2-rca-webhook
        webhook_configs:
          - url: {{ .Values.stage2WebhookUrl | quote }}
            send_resolved: true
            http_config:
              follow_redirects: true
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/trigger-token

    inhibit_rules:
      - source_match:
          alertname: NodeMemoryPressure
        target_match_re:
          alertname: ServiceHighErrorRate|ServiceHighErrorRateHTTP|ServiceHighLatency|ContainerMemoryNearLimit|SLOAvailabilityFastBurn|SLOAvailabilitySlowBurn|SLOLatencyFastBurn|SLOLatencySlowBurn
        equal: ['node']

      - source_match:
          alertname: NodeCPUSaturation
        target_match_re:
          alertname: ServiceHighLatency|ServiceTrafficSpike|SLOLatencyFastBurn|SLOLatencySlowBurn
        equal: ['node']

      - source_match:
          alertname: SLOAvailabilityFastBurn
        target_match_re:
          alertname: ServiceHighErrorRate|ServiceHighErrorRateHTTP
        equal: ['service']

      - source_match:
          alertname: OtelGatewayDown
        target_match_re:
          layer: service|slo|dependency
