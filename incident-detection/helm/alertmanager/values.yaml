# ============================================================
# Alertmanager — Default values
# Receives alerts from Prometheus, deduplicates them, and
# routes them to the Stage 2 RCA webhook.
# ============================================================

image:
  repository: prom/alertmanager
  tag: "v0.27.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "alertmanager"

replicaCount: 1

service:
  type: ClusterIP
  port: 9093

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: false
  storageClassName: ""
  size: 1Gi
  accessModes:
    - ReadWriteOnce

# ── Alertmanager routing configuration ───────────────────
# stage2WebhookUrl MUST point at causa-ingest /trigger (opens the incident
# window, then forwards to Stage-2). Direct Stage-2 bypass is unsupported —
# set ALLOW_STAGE2_BYPASS=1 only for local debug and accept LookupError noise.
stage2WebhookUrl: "http://causa-ingest.causa-ingest.svc.cluster.local:8080/trigger"

auth:
  existingSecret: ""
  tokenKey: TRIGGER_AUTH_TOKEN
  triggerToken: "causa-dev-ingest-token"

config:
  # How long to wait before re-sending a firing alert
  repeatInterval: 1h
  # Wait this long to batch multiple alerts that fire together
  groupWait: 30s
  # After first notification, wait this long before sending updates
  groupInterval: 5m

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
