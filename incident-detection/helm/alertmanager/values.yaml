# ============================================================
# Alertmanager — Default values
# Receives alerts from Prometheus, deduplicates them, and
# routes them to the Stage 2 RCA webhook.
# ============================================================

image:
  repository: prom/alertmanager
  tag: "v0.27.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "alertmanager"

replicaCount: 1

service:
  type: ClusterIP
  port: 9093

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: false
  storageClassName: ""
  size: 1Gi
  accessModes:
    - ReadWriteOnce

# ── Alertmanager routing configuration ───────────────────
# stage2WebhookUrl: the HTTP endpoint alerts are POSTed to.
# This now points at the Dev-A ingestion trigger (causa-ingest), which opens the
# incident window + records incident state, then forwards to the Stage-2 engine
# (chain, don't replace). To bypass ingestion, point this back at stage2-rca.
stage2WebhookUrl: "http://causa-ingest.causa-ingest.svc.cluster.local:8080/trigger"

config:
  # How long to wait before re-sending a firing alert
  repeatInterval: 1h
  # Wait this long to batch multiple alerts that fire together
  groupWait: 30s
  # After first notification, wait this long before sending updates
  groupInterval: 5m

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
