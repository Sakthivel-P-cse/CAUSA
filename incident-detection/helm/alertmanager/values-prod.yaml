# ============================================================
# Alertmanager — Production overrides
# ============================================================

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

persistence:
  enabled: true
  storageClassName: "standard"   # Override: STORAGE_CLASS=<name> ./scripts/deploy.sh prod
  size: 2Gi

# In prod, alert faster and persist notification state
config:
  repeatInterval: 1h
  groupWait: 30s
  groupInterval: 5m
