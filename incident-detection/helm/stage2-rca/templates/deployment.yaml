{{- if and .Values.production (not .Values.image.digest) (or (not .Values.image.tag) (eq .Values.image.tag "latest") (eq .Values.image.tag "local")) }}
{{- fail "production requires image.digest or an immutable image.tag (not local/latest)" }}
{{- end }}
{{- if and .Values.production (not .Values.existingSecret) }}
{{- fail "production requires existingSecret with database passwords" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stage2-rca.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stage2-rca.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stage2-rca.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stage2-rca.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "stage2-rca.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rca
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "rca.trigger.app"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            {{- if ne $key "PGPASSWORD" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "stage2-rca.fullname" . }}-secret{{ end }}
                  key: PGPASSWORD
            - name: REMEDIATION_PGUSER
              value: "causa_remediator"
            - name: REMEDIATION_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "stage2-rca.fullname" . }}-secret{{ end }}
                  key: REMEDIATION_PGPASSWORD
            - name: CAUSA_REMEDIATION_AUTO_PROPOSE
              value: {{ .Values.remediation.autoPropose | quote }}
            - name: CAUSA_REMEDIATION_AUTO_APPLY
              value: {{ .Values.remediation.autoApply | quote }}
            - name: CAUSA_REMEDIATION_AUTO_ACTIONS
              value: {{ join "," .Values.remediation.autoActions | quote }}
            - name: CAUSA_DEMO_ALLOW_UNCALIBRATED_AUTO_APPLY
              value: {{ .Values.remediation.allowUncalibratedDemo | quote }}
            - name: CAUSA_ENVIRONMENT
              value: {{ .Values.environment | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
