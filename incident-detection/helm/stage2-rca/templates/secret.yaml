{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stage2-rca.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stage2-rca.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGPASSWORD: {{ required "env.PGPASSWORD is required when existingSecret is empty" .Values.env.PGPASSWORD | quote }}
{{- end }}
