apiVersion: v1
kind: Service
metadata:
  name: stage2-rca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stage2-rca.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "stage2-rca.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
