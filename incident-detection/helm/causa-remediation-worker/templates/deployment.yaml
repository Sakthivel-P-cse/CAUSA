{{- if and .Values.production (not .Values.image.digest) (or (not .Values.image.tag) (eq .Values.image.tag "latest") (eq .Values.image.tag "local")) }}
{{- fail "production requires image.digest or an immutable image.tag (not local/latest)" }}
{{- end }}
{{- if and .Values.production (not .Values.existingSecret) }}
{{- fail "production requires existingSecret with PGPASSWORD" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-remediation-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: causa-remediation-worker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: causa-remediation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: causa-remediation-worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "remediation.worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}causa-remediation-worker-secret{{ end }}
                  key: PGPASSWORD
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
