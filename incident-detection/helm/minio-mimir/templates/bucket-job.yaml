apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "minio-mimir.fullname" . }}-createbucket
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio-mimir.labels" . | nindent 4 }}
  annotations:
    # Run after MinIO is installed/upgraded; retry-safe (idempotent).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "minio-mimir.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "minio-mimir.serviceAccountName" . }}
      containers:
        - name: createbucket
          image: "{{ .Values.mcImage.repository }}:{{ .Values.mcImage.tag }}"
          imagePullPolicy: {{ .Values.mcImage.pullPolicy }}
          env:
            - name: MC_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio-mimir.secretName" . }}
                  key: {{ .Values.auth.rootUserKey }}
            - name: MC_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio-mimir.secretName" . }}
                  key: {{ .Values.auth.rootPasswordKey }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Wait for the MinIO S3 API to accept connections.
              until mc alias set minio \
                "http://{{ include "minio-mimir.endpoint" . }}" \
                "$MC_ROOT_USER" "$MC_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for minio-mimir to be ready..."
                sleep 3
              done
              # Create the bucket if absent (idempotent).
              mc mb --ignore-existing "minio/{{ .Values.bucket }}"
              echo "bucket ready: {{ .Values.bucket }}"
