[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causa-ingest"
version = "0.1.0"
description = "Causa Dev-A lane — telemetry ingestion (C1), anomaly primitives (C2), and testbed ground truth (C5)."
readme = "ingest/README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# The trigger service persists incident state to Postgres.
trigger = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools]
# The Dev-A lane is a set of top-level packages that all depend on `contracts`
# (the shared seam), which itself depends on nothing but the stdlib. Listing them
# explicitly keeps the discovery deterministic and avoids sweeping in helm/ or scripts/.
packages = [
    "contracts",
    "ingest",
    "ingest.clients",
    "ingest.trigger",
    "anomaly",
    "graphs",
    "isolation",
    "rca",
    "rca.trigger",
    "scoring",
    # The ground-truth harness (contract C5) is part of the lane's deliverable,
    # so it ships with the distribution rather than living only in-tree.
    "testbed",
    "testbed.harness",
]

[tool.setuptools.package-data]
# The chaos CRDs are data the harness reads at runtime (catalog.CHAOS_DIR); ship
# them so `run_scenario` works from an installed distribution, not just in-tree.
testbed = ["chaos/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
