name: Remediation PR CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "remediation/**"
      - "testbed/demo-bugs/**"
      - ".github/workflows/remediation-*.yml"
  push:
    branches: ["causa/fix-*"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile remediation modules
        run: python -m compileall remediation -q
      - name: Unit tests (plan schema + propose)
        working-directory: .
        env:
          CAUSA_NIM_ENABLED: "0"
          PYTHONPATH: ".import:."
        run: |
          pip install -q pytest httpx
          pytest -q tests/test_remediation_service.py tests/test_dev_c.py -k "typed_plan or propose or apply_plan_v1_disabled" --maxfail=5
      - name: Rules-only propose smoke
        working-directory: .
        env:
          CAUSA_NIM_ENABLED: "0"
          PYTHONPATH: ".import:."
        run: |
          python - <<'PY'
          from remediation.service import propose_for_report, apply_plan_v1
          report = {
            "incident_id": "ci-smoke",
            "alert_name": "HighErrorRate",
            "alerted_service": "checkout",
            "root_cause_service": "checkout",
            "origin_candidates": [{
              "node_id": "checkout",
              "node_kind": "service",
              "score": 1.0,
              "confidence": 0.9,
              "role": "origin",
              "signals": {"T": 1, "D": 1, "P": 1},
              "dev_vector": {"error_rate": 0.7},
              "explanation": "exception panic",
            }],
          }
          out = propose_for_report(report)
          assert out["ok"], out
          disabled = apply_plan_v1(out["plan"])
          assert disabled.get("mode") == "worker_required"
          print("ok", out["plan"]["fault_class"], out["plan"].get("action"))
          PY
