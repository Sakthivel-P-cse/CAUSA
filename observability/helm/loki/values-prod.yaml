# ============================================================
# Loki — Production environment overrides
# Persistent storage, higher resources, longer retention, S3 backend.
#
# Loki writes chunk blocks to minio-loki (dedicated MinIO instance).
# S3 creds must match the minio-loki root credentials. Pre-create:
#   kubectl create namespace loki --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n loki create secret generic loki-s3-secret \
#     --from-literal=root-user='<ACCESS_KEY>' \
#     --from-literal=root-password='<SECRET_KEY>'
# ============================================================

replicaCount: 1

config:
  auth_enabled: false
  backend: s3     # Chunks now live in MinIO (minio-loki), not on disk.
  storage:
    bucket: "loki-chunks"
    endpoint: "minio-loki.minio-loki.svc.cluster.local:9000"
    region: "us-east-1"
    insecure: true   # in-cluster plain HTTP
    existingSecret: "loki-s3-secret"
    accessKeyKey: "root-user"
    secretKeyKey: "root-password"
  retention: 336h   # 14 days
  limits_config:
    retention_period: 336h
    ingestion_rate_mb: 50
    ingestion_burst_size_mb: 100
    max_query_length: 0h

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# The PVC is only the WAL/index scratch dir; chunk blocks go to MinIO.
persistence:
  enabled: true
  storageClassName: "standard"   # Override at deploy time: STORAGE_CLASS=<name> ./scripts/deploy.sh prod
  size: 10Gi
  accessModes:
    - ReadWriteOnce

