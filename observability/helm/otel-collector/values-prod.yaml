# ============================================================
# OTel Collector — Production environment overrides
# Higher replicas, larger batches, TLS config documented
# ============================================================

replicaCount: 2   # Ignored when autoscaling.enabled=true (HPA owns replicas)

# Gateway scales with telemetry volume. The LB tier (otel-lb) routes
# trace spans by trace ID so that every span of a trace lands on the
# same gateway pod — which is the precondition for tail_sampling to
# see whole traces at >1 replica. The LB → gateway chain is fully
# wired: agents → otel-lb → this gateway → tail_sampling → Tempo.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

config:
  processors:
    batch:
      sendBatchSize: 2048
      timeout: 10s
    memoryLimiter:
      limitMib: 800
      spikeLimitMib: 256
    # Larger buffers + longer decision window for prod trace volumes.
    tailSampling:
      decisionWait: 15s
      numTraces: 100000
      expectedNewTracesPerSec: 500
      latencyThresholdMs: 500
      samplingPercentage: 10

  exporters:
    # ── Traces → Tempo (OTLP gRPC) ─────────────────────────
    # PRD2 §12: Tempo speaks OTLP → gRPC. Use the gRPC exporter
    # on :4317 (not otlphttp pointed at the gRPC port).
    #
    # TLS OPTIONS (choose one):
    #
    # Option A — In-cluster plaintext (current, acceptable if service mesh
    #             handles mTLS, e.g. Istio/Linkerd):
    #   insecure: true
    #
    # Option B — App-layer TLS via cert-manager (recommended for high-security env):
    #   insecure: false
    #   cert_file: /etc/otel/certs/tls.crt
    #   key_file:  /etc/otel/certs/tls.key
    #   ca_file:   /etc/otel/certs/ca.crt
    #   (mount the cert-manager Certificate secret as a volume in deployment.yaml)
    tempo:
      protocol: "grpc"
      endpoint: "tempo.tempo.svc.cluster.local:4317"
      tls:
        insecure: true   # Deliberate: in-cluster traffic. See options above to enable mTLS.

    # ── Metrics → Prometheus remote_write (two-hop chain) ────
    # OTel Collector pushes app OTLP metrics here → Prometheus
    # ingests them via /api/v1/write and holds them for short-term
    # alerting + recent queries. Prometheus then remote_writes every
    # sample to Mimir for long-term storage.
    #
    # Chain: OTel Collector ─prometheusremotewrite─► Prometheus :9090
    #                                     └─remote_write─► Mimir :8080
    #
    # We intentionally keep Prometheus in the middle (not push direct
    # to Mimir) because Prometheus owns: alert rule evaluation,
    # recording rules, Alertmanager integration, and scraping of
    # kube-state-metrics / node-exporter / OTel Collector self-metrics.
    prometheusremotewrite:
      endpoint: "http://prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
      tls:
        insecure: true   # In-cluster plain HTTP; same namespace trust boundary.

    # ── Logs → Loki (HTTP) ──────────────────────────────────
    # Switch endpoint to https:// and set insecure: false when Loki
    # is fronted by an HTTPS ingress or cert-manager-issued cert.
    loki:
      endpoint: "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
      tls:
        insecure: true   # Deliberate: plain HTTP in-cluster. Switch to https:// + insecure: false for TLS.

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
