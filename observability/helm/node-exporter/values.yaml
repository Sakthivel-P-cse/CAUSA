# ============================================================
# node-exporter — Default values
# Runs as a DaemonSet on every node to expose hardware / OS metrics.
# Required by Stage 2 RCA — Infrastructure Level Graph (Graph 2)
# Provides: node_cpu_seconds_total, node_memory_MemAvailable_bytes,
#           node_disk_io_time_seconds_total, node_network_receive_bytes_total
# ============================================================

image:
  repository: prom/node-exporter
  tag: "v1.7.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "node-exporter"

service:
  type: ClusterIP
  port: 9100

resources:
  requests:
    cpu: 50m
    memory: 30Mi
  limits:
    cpu: 200m
    memory: 100Mi

serviceAccount:
  create: true
  name: ""

# DaemonSet rolling update — replace one pod at a time
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"
  prometheus.io/path: "/metrics"

# Run on ALL nodes including control-plane nodes
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

nodeSelector: {}

affinity: {}
