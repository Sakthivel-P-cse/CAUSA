{{- if and (eq .Values.config.backend "s3") (not .Values.config.storage.existingSecret) }}
# Dev-only: S3 credentials (MinIO root creds) rendered from values.
# In prod set config.storage.existingSecret and this is skipped.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tempo.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.storage.accessKeyKey }}: {{ .Values.config.storage.accessKey | quote }}
  {{ .Values.config.storage.secretKeyKey }}: {{ .Values.config.storage.secretKey | quote }}
{{- end }}
