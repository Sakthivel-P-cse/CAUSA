# ============================================================
# Tempo — Default values (shared across all environments)
# Override with values-dev.yaml or values-prod.yaml
# ============================================================

replicaCount: 1

image:
  repository: grafana/tempo
  tag: "2.4.1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "tempo"

service:
  type: ClusterIP
  ports:
    otlpGrpc: 4317          # OTLP gRPC receiver (from OTel Collector)
    otlpHttp: 4318          # OTLP HTTP receiver
    tempoQuery: 3200        # Tempo query/query-frontend port (Grafana datasource)

config:
  # Tempo storage backend: 'local' | 's3' | 'gcs' | 'azure'
  backend: local

  # ── Object storage (S3 → MinIO) — used when backend: s3 ─────────
  # Points at the dedicated minio-tempo instance and its bucket.
  # dev  → plain access/secret keys below.
  # prod → existingSecret (see values-prod.yaml).
  storage:
    bucket: "tempo-traces"
    endpoint: "minio-tempo.minio-tempo.svc.cluster.local:9000"
    region: "us-east-1"     # arbitrary for MinIO; must be non-empty
    insecure: true          # in-cluster plain HTTP to MinIO
    accessKey: "minio"
    secretKey: "minio_dev_pass"
    existingSecret: ""
    accessKeyKey: "root-user"
    secretKeyKey: "root-password"

  # Trace retention duration
  retention: 24h

  # Server configuration
  server:
    http_listen_port: 3200

  # Ingester (writes traces to storage)
  ingester:
    max_block_duration: 5m

  # Compactor (merges trace blocks)
  compactor:
    compaction:
      block_retention: 24h

  # Distributor — which receivers to enable
  distributor:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

  # Metrics generator — builds service graph + span metrics, writes to Prometheus
  # These metrics are consumed by Stage 2 RCA for Graph 1 (Service Dependency Graph) edges
  metricsGenerator:
    remoteWriteUrl: "http://prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
    serviceGraphs:
      histogramBuckets: "[0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]"
      maxItems: 10000
      wait: 10s
      workers: 10
    spanMetrics:
      histogramBuckets: "[0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]"
      enableTargetInfo: true
    forwarder:
      queueSize: 10000
      workers: 8

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: false
  storageClassName: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
