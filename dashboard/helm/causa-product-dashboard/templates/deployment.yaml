{{- if and .Values.production (not .Values.image.digest) (or (not .Values.image.tag) (eq .Values.image.tag "latest") (eq .Values.image.tag "local")) }}
{{- fail "production requires image.digest or an immutable image.tag (not local/latest)" }}
{{- end }}
{{- if and .Values.production (or (not .Values.auth.existingSecret) (not .Values.auth.databaseSecret)) }}
{{- fail "production requires existing auth and database Secrets" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "causa-product-dashboard.name" . }}
  labels:
    app: {{ include "causa-product-dashboard.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "causa-product-dashboard.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "causa-product-dashboard.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8090
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.env.PROMETHEUS_URL | quote }}
            - name: LOKI_URL
              value: {{ .Values.env.LOKI_URL | quote }}
            - name: TEMPO_URL
              value: {{ .Values.env.TEMPO_URL | quote }}
            - name: PGHOST
              value: {{ .Values.env.PGHOST | quote }}
            - name: PGPORT
              value: {{ .Values.env.PGPORT | quote }}
            - name: PGDATABASE
              value: {{ .Values.env.PGDATABASE | quote }}
            - name: PGUSER
              value: {{ .Values.env.PGUSER | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.databaseSecret }}
                  key: {{ .Values.auth.databasePasswordKey }}
            - name: CAUSA_API_REQUIRE_AUTH
              value: "1"
            - name: CAUSA_API_VIEWER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: CAUSA_API_VIEWER_TOKEN
            - name: CAUSA_REMEDIATION_PROPOSER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: CAUSA_REMEDIATION_PROPOSER_TOKEN
            - name: REMEDIATION_APPROVAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: REMEDIATION_APPROVAL_TOKEN
            - name: CAUSA_REMEDIATION_AUTO_PROPOSE
              value: "0"
            - name: CAUSA_REMEDIATION_AUTO_APPLY
              value: "0"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "causa-product-dashboard.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "causa-product-dashboard.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8090
